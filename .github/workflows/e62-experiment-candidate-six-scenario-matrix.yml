name: E62 EXPERIMENT 3ms Quarter-CAP1 Six-Scenario Motor Matrix (NOT Original P1)

on:
  push:
    branches: [experiment/e62-early-bemf-quartergate]
    paths:
      - 'tests/e62_autonomous_native_motor_probe.py'
      - 'tools/experimental_e62_pinned_ival_patch.py'
      - 'tools/experimental_e62_candidate_matrix.py'
      - '.github/workflows/e62-experiment-candidate-six-scenario-matrix.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate-scenario-matrix:
    runs-on: ubuntu-24.04
    timeout-minutes: 48
    strategy:
      fail-fast: false
      matrix:
        pair:
          - [smoke, gentle]
          - [direct20, steps]
          - [ramp20_100ms, ramp20_500ms]
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned QEMU source prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            libglib2.0-dev libpixman-1-dev libfdt-dev pkg-config meson ninja-build
          git submodule update --init --depth 1 qemu
          python3 -m py_compile tests/e62_autonomous_native_motor_probe.py \
            tools/experimental_e62_pinned_ival_patch.py \
            tools/experimental_e62_candidate_matrix.py
          ./build.sh
      - name: Create exact three-instruction non-original ELF
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          echo '05563b6931b58aaba1df5105313c36c9de2d5797a0a3b190c86777c5773f13c0  baseline/e62-g13b3/firmware/AM13E-rev17.3.elf' | sha256sum -c -
          python3 tools/experimental_e62_pinned_ival_patch.py \
            --elf baseline/e62-g13b3/firmware/AM13E-rev17.3.elf \
            --output-elf artifacts/e62-exp-three-instruction-NOT-ORIGINAL.elf \
            --proof-json artifacts/e62-exp-patch-proof.json
          python3 tools/sim_motor_cfg.py --sim-only-opt-in \
            --elf baseline/e62-g13b3/firmware/AM13E-rev17.3.elf \
            --motor-profile ecx87-kv147 \
            --output artifacts/e62-exp-cfg.bin
      - name: Execute two native source scenarios with exact candidate SHA
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/experimental_e62_candidate_matrix.py \
            --qemu .build/qemu-src/build/qemu-system-arm \
            --candidate artifacts/e62-exp-three-instruction-NOT-ORIGINAL.elf \
            --original baseline/e62-g13b3/firmware/AM13E-rev17.3.elf \
            --patch-proof artifacts/e62-exp-patch-proof.json \
            --cfg artifacts/e62-exp-cfg.bin \
            --case "${{ matrix.pair[0] }}" --case "${{ matrix.pair[1] }}" \
            --output artifacts/e62-exp-matrix --wall-timeout-s 300
      - name: Preserve complete experiment, negative verdicts and physical source
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e62-exp-three-movw-quarter-capture-${{ matrix.pair[0] }}-${{ matrix.pair[1] }}
          path: |
            artifacts/e62-exp-matrix/**
            artifacts/e62-exp-patch-proof.json
          if-no-files-found: warn
          retention-days: 21
