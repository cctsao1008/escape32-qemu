name: "E62 #5 SIM_ONLY Original Guest Native BEMF -> ADC SOC EOC"

on:
  push:
    branches: [main]
    paths:
      - 'machine/am13e23019.c'
      - 'machine/am13e_native_motor_plant.inc'
      - 'tests/e62_autonomous_native_motor_probe.py'
      - 'tests/test_e62_sim_model_profile.py'
      - 'tools/e62_sim_profile_contract.py'
      - 'configs/e62-sim-profile-matrix-v1.json'
      - '.github/workflows/e62-native-guest-adc-bemf.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  strict-adc-phase-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Check exact ADC0/1/2 SOC route and no rotor angle / rearm authorization
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p test_e62_sim_model_profile.py -v
          python3 -m tools.e62_sim_profile_contract --output /tmp/e62-sim-adc-contract.json

  actual-original-guest-phase-adc-eoc:
    needs: strict-adc-phase-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build native QEMU and pin immutable Original Guest
        run: |
          set -euo pipefail
          echo '05563b6931b58aaba1df5105313c36c9de2d5797a0a3b190c86777c5773f13c0  baseline/e62-g13b3/firmware/AM13E-rev17.3.elf' | sha256sum -c -
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            libglib2.0-dev libpixman-1-dev libfdt-dev pkg-config meson ninja-build binutils-arm-none-eabi
          git submodule update --init --depth 1 qemu
          ./build.sh
          mkdir -p artifacts/e62-native-adc-bemf
          python3 tools/sim_motor_cfg.py --sim-only-opt-in \
            --elf baseline/e62-g13b3/firmware/AM13E-rev17.3.elf \
            --motor-profile ecx87-kv147 \
            --output artifacts/e62-native-adc-bemf/kv147-g13b3-cfg-flash.bin
      - name: Require native Guest ADC0/1/2 EOC actually sourced by motor
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/e62_autonomous_native_motor_probe.py \
            --qemu .build/qemu-src/build/qemu-system-arm \
            --elf baseline/e62-g13b3/firmware/AM13E-rev17.3.elf \
            --sim-motor-profile ecx87-kv147 \
            --sim-native-adc-bemf \
            --cfg-flash artifacts/e62-native-adc-bemf/kv147-g13b3-cfg-flash.bin \
            --scenario scenarios/e62-native-p0-smoke.json \
            --wall-timeout-s 300 \
            --artifact artifacts/e62-native-adc-bemf/guest-adc.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          run=json.loads(Path('artifacts/e62-native-adc-bemf/guest-adc.json').read_text())
          source=run['native_motor']
          before=run['motor_before']
          assert source['sim_native_adc_bemf_enabled'] is True
          assert before['sim_native_adc_bemf_enabled'] is True
          assert before['guest_adc_phase_eoc_from_plant']==[0,0,0]
          counts=source['guest_adc_phase_eoc_from_plant']
          nonmid=source['guest_adc_phase_nonmidscale_eoc']
          guest_reads=source['guest_adc_phase_result_reads']
          assert len(counts)==3 and all(isinstance(x,int) and x>0 for x in counts),counts
          assert len(nonmid)==3 and all(isinstance(x,int) and x>0 for x in nonmid),nonmid
          assert len(guest_reads)==3 and all(isinstance(x,int) and x>0 for x in guest_reads),guest_reads
          assert run['original_elf_sha256']=='05563b6931b58aaba1df5105313c36c9de2d5797a0a3b190c86777c5773f13c0'
          assert run['host_guest_register_writes'] is False
          assert run['used_guest_wfi_or_gdb'] is False
          assert run['synthetic_timed_bemf_enabled'] is False
          print('PASS_SIM_NATIVE_BEMF_TO_GUEST_ADC0_1_2_REAL_SOC_EOC_NOT_REARM',
                'eoc',counts,'dynamic',nonmid,'guest_reads',guest_reads)
          PY
      - name: Save authentic QEMU and Guest phase ADC diagnostics even when FAIL
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e62-qemu-source-original-guest-adc-bemf-no-rearm
          path: artifacts/e62-native-adc-bemf/**
          if-no-files-found: warn
          retention-days: 30
