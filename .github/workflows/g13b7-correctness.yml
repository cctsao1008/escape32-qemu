name: E62 G13B7.1 Correctness and Native T01
on:
  push:
    branches: [main]
    paths:
      - 'machine/**'
      - 'tools/autonomous_sitl_*.py'
      - 'tests/g13b4_functional_dshot_sitl.py'
      - 'tests/functional_dshot_sitl.py'
      - 'tools/native_arming.py'
      - 'tools/sitl_*.py'
      - 'tools/ci/check_autonomous_host.sh'
      - 'tools/ci/verify_t01.py'
      - 'tools/ci/qualification_matrix.py'
      - 'tests/test_t02_*.py'
      - 'tests/test_autonomous*.py'
      - '.github/workflows/g13b7-correctness.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-oracles:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Syntax and adversarial sampled-stage oracle tests
        shell: bash
        run: |
          set -euo pipefail
          bash tools/ci/check_autonomous_host.sh
          echo PASS_G13B7_1_HOST_ORACLES

  native-t01:
    needs: host-oracles
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Install pinned QEMU host dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            libglib2.0-dev libpixman-1-dev libfdt-dev pkg-config \
            meson ninja-build binutils-arm-none-eabi
      - name: Build source QEMU and check pinned original ELF identity
        shell: bash
        run: |
          set -euo pipefail
          git submodule update --init --depth 1 qemu
          ./build.sh
          sha256sum baseline/e62-g13b3/firmware/AM13E-rev17.3.elf
          echo '05563b6931b58aaba1df5105313c36c9de2d5797a0a3b190c86777c5773f13c0  baseline/e62-g13b3/firmware/AM13E-rev17.3.elf' | sha256sum -c -
          mkdir -p artifacts
          python3 tools/native_sim_cfg_flash.py --sim-only-opt-in \
            --elf baseline/e62-g13b3/firmware/AM13E-rev17.3.elf \
            --output artifacts/e62-g13b3-g13b7-1-cfg-flash.bin
      - name: Bounded functional smoke — OPEN is required
        shell: bash
        run: |
          set +e
          set -uo pipefail
          rc=0
          python3 tests/functional_dshot_sitl.py \
            --autonomous \
            --qemu .build/qemu-src/build/qemu-system-arm \
            --elf baseline/e62-g13b3/firmware/AM13E-rev17.3.elf \
            --cfg-flash artifacts/e62-g13b3-g13b7-1-cfg-flash.bin \
            --plan scenarios/e62-dshot-v1.json --id T01 \
            --max-frames 50 --artifact artifacts/e62-g13b7-1-smoke.json \
            2>&1 | tee artifacts/e62-g13b7-1-smoke.log
          rc=${PIPESTATUS[0]}
          set -e
          python3 - "$rc" <<'PY'
          import json,sys
          d=json.load(open('artifacts/e62-g13b7-1-smoke.json'))
          assert int(sys.argv[1]) != 0
          assert d['status']=='OPEN_AUTONOMOUS_BOUNDED_SMOKE',d.get('status')
          assert not d.get('issues'),d.get('issues')
          assert d['dshot_frames_sent']==50,d.get('dshot_frames_sent')
          print('PASS_G13B7_1_BOUNDED_NATIVE_SMOKE')
          PY
      - name: Full original-Guest T01 — strict sampled functional gate
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/time -p python3 tests/functional_dshot_sitl.py \
            --autonomous --autonomous-telemetry-interval-ms 200 \
            --autonomous-wall-timeout-s 900 \
            --qemu .build/qemu-src/build/qemu-system-arm \
            --elf baseline/e62-g13b3/firmware/AM13E-rev17.3.elf \
            --cfg-flash artifacts/e62-g13b3-g13b7-1-cfg-flash.bin \
            --plan scenarios/e62-dshot-v1.json --id T01 \
            --artifact artifacts/e62-g13b7-1-full.json \
            2>&1 | tee artifacts/e62-g13b7-1-full.log
          python3 tools/ci/verify_t01.py artifacts/e62-g13b7-1-full.json \
            --output artifacts/e62-g13b7-1-independent-qualification.json
          python3 - <<'PY'
          import json
          d=json.load(open('artifacts/e62-g13b7-1-full.json'))
          assert d['status']=='PASS_AUTONOMOUS_AGGREGATE_FUNCTIONAL',d.get('issues')
          assert d['dshot_frames_sent']==11000
          assert all(s['sampled_stage_gate']['status']=='PASS_SAMPLED_STAGE_DIAGNOSTIC'
                     for s in d['stages'])
          assert all(s['valid_crc_feeds_observed'] is None for s in d['stages'])
          assert all(s['native_steps_observed'] is None for s in d['stages'])
          assert d['autonomous']['event_timing_evidence']['trace_triplets']>0
          assert d['autonomous']['neutral_teardown']['qualified']
          print('PASS_G13B7_1_ORIGINAL_GUEST_FULL_T01')
          PY
      - name: Preserve pass or failure forensic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g13b7-1-native-t01
          path: |
            artifacts/e62-g13b7-1-*.json
            artifacts/e62-g13b7-1-*.log
          if-no-files-found: warn
          retention-days: 14
