name: E62 G13B3 host-model unit regressions

on:
  push:
    branches: [main]
    paths:
      - 'tools/**'
      - 'tests/test_g13b3_native_pwm.py'
      - 'tests/test_g13b3_native_transport.py'
      - 'tests/g1_handoff.py'
      - 'tests/g0_memory.py'
      - 'tests/g11_exception_lifecycle.py'
      - 'tests/test_g13b3_native_seed.py'
      - 'tests/test_g13b3_native_bemf.py'
      - 'tests/test_g13b3_native_runtime.py'
      - 'tests/test_g13b3_native_injection.py'
      - 'tests/test_g13b3_native_capture.py'
      - 'tests/test_g13b3_native_policy.py'
      - 'tests/test_g13b3_native_timeout.py'
      - 'tests/test_g13b3_native_timg12.py'
      - 'tests/test_g13b3_native_deadband.py'
      - 'tests/test_g13b3_native_power_path.py'
      - 'tests/test_g13b3_native_power_coupled.py'
      - 'tests/test_g13b3_native_closed_loop_audit.py'
      - 'tests/test_g13b3_native_extended_run.py'
      - 'tests/test_g13b3_native_rotor_motion.py'
      - 'tools/native_rotor_motion_audit.py'
      - 'tools/sitl_trace.py'
      - 'tools/sitl_live.py'
      - 'tests/test_sitl_live.py'
      - 'tests/test_sitl_trace.py'
      - 'tests/test_sitl_viewer.py'
      - 'web/sitl_trace_viewer.html'
      - 'docs/sitl-workbench.md'
      - 'tests/test_e62_hardware_evidence.py'
      - 'tools/e62_hardware_evidence.py'
      - 'tools/native_extended_run_gate.py'
      - 'tests/test_g13b3_native_sim_cfg_startup.py'
      - 'tests/test_g13b3_native_sim_cfg_flash.py'
      - 'tests/test_g13b3_native_arming_zero_wire.py'
      - 'tests/test_virtual_bldc.py'
      - '.github/workflows/g13b3-host-unit.yml'
  workflow_dispatch:

jobs:
  host-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Python model and fail-closed input validation
        run: |
          set -euo pipefail
          python3 --version
          python3 tests/test_virtual_bldc.py
          python3 tests/test_g13b3_native_transport.py
          python3 tests/test_sitl_trace.py
          python3 tests/test_sitl_live.py
          python3 tests/test_sitl_viewer.py
          python3 -m py_compile tests/g13b2_native_drive_probe.py
          python3 tests/test_g13b3_native_pwm.py
          python3 tests/test_g13b3_native_seed.py
          python3 tests/test_g13b3_native_bemf.py
          python3 tests/test_g13b3_native_runtime.py
          python3 tests/test_g13b3_native_injection.py
          python3 tests/test_g13b3_native_capture.py
          python3 tests/test_g13b3_native_policy.py
          python3 tests/test_g13b3_native_timeout.py
          python3 tests/test_g13b3_native_timg12.py
          python3 tests/test_g13b3_native_deadband.py
          python3 tests/test_g13b3_native_power_path.py
          python3 tests/test_g13b3_native_power_coupled.py
          python3 tests/test_g13b3_native_closed_loop_audit.py
          python3 tests/test_g13b3_native_extended_run.py
          python3 tests/test_g13b3_native_rotor_motion.py
          python3 tests/test_e62_hardware_evidence.py
          python3 tools/e62_hardware_evidence.py --csv docs/fixtures/e62-hardware-measurements.csv --output /tmp/e62-physical-evidence-open.json
          python3 -c 'import json; x=json.load(open("/tmp/e62-physical-evidence-open.json")); assert x["hardware_qualified"] is False and x["captured_rows"] == 0'
          python3 tests/test_g13b3_native_sim_cfg_startup.py
          python3 tests/test_g13b3_native_sim_cfg_flash.py
          python3 tests/test_g13b3_native_arming_zero_wire.py
          echo PASS_G13B3_HOST_ONLY_UNIT_REGRESSIONS

      # No QEMU or original ELF here. Positive motor-closed-loop
      # acceptance must come from firmware-backed CI separately.