name: E62 SIM_ONLY Source-built BEMF 3ms-Quarter Five-Profile Matrix (NOT P1)
on:
  push:
    branches: [experiment/e62-early-bemf-quartergate]
    paths:
      - '.github/workflows/e62-source-built-five-profile-matrix.yml'
      - 'tools/experimental_e62_bemf_ab.py'
      - 'machine/am13e_autonomous_sitl.inc'
      - 'machine/am13e23019.c'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare-source-built-sensorless:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        profile: [smoke, gentle, steps, ramp100, ramp500]
    steps:
      - uses: actions/checkout@v4
      - name: Complete ARM GNU/Newlib toolchain
        uses: carlosperate/arm-none-eabi-gcc-action@v1
      - name: Pin QEMU source, SDK and both Guest source-policy variants
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            libglib2.0-dev libpixman-1-dev libfdt-dev pkg-config meson ninja-build
          git submodule update --init --depth 1 qemu
          python3 -m py_compile tools/experimental_e62_bemf_ab.py
          python3 tests/test_e62_experimental_fc_profiles.py
          echo '05563b6931b58aaba1df5105313c36c9de2d5797a0a3b190c86777c5773f13c0  baseline/e62-g13b3/firmware/AM13E-rev17.3.elf' | sha256sum -c -
          ./build.sh
          git clone --quiet https://github.com/cctsao1008/ESCape32.git .build/source-built-esc
          git -C .build/source-built-esc checkout --quiet --detach 907c5c3285ea1eebafe247c918c882609bf2db16
          test "$(git -C .build/source-built-esc rev-parse HEAD)" = '907c5c3285ea1eebafe247c918c882609bf2db16'
          git clone --quiet --depth 1 https://github.com/TexasInstruments/am13e2x_sdk.git /tmp/am13e-ti-sdk
          git -C /tmp/am13e-ti-sdk fetch --quiet --depth 1 origin b872469ceef18de5e39a1d3acb0821ec158b44c7
          git -C /tmp/am13e-ti-sdk checkout --quiet --detach b872469ceef18de5e39a1d3acb0821ec158b44c7
      - name: Verify Motor Output=1 and model-derived BEMF reference (NOT a physical-board calibration)
        shell: bash
        run: |
          set -euo pipefail
          fw="$PWD/.build/source-built-esc"
          grep -Fq 'AM13E_E62_REQUIRE_MOTOR_OUTPUT=1' \
            "$fw/mcu/_support/AM13E/cmake/test_profiles/e62_sim_only_motor_output.cmake"
          grep -Fq 'AM13E_BEMF_INITIAL_DAC_CODE=2048' \
            "$fw/mcu/_support/AM13E/cmake/test_profiles/e62_sim_only_motor_output.cmake"
          grep -Fq 'AM13E_SIM_ONLY_EXPERIMENTAL_EARLY_BEMF=1' \
            "$fw/mcu/_support/AM13E/cmake/test_profiles/e62_sim_only_early_bemf.cmake"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('machine/am13e_native_analog_frontend.inc').read_text()
          assert 'double voltage = 1.65+0.02*bemf;' in p
          assert 'round(4095.0*voltage/3.3)' in p
          assert round(4095.0*1.65/3.3)==2048
          print('PASS_SIM_ONLY_1p65V_BEMF_ZERO_REFERENCE_2048')
          PY
      - name: Build both policy variants with same six-output enabled electrical model
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          fw="$PWD/.build/source-built-esc"
          cmake -S "$fw" -B .build/esc-control -G "Unix Makefiles" \
            -DESCAPE32_BUILD_AM13E=ON -DAM13E_SDK_ROOT=/tmp/am13e-ti-sdk \
            -DAM13E_BOARD_BOARD_PROFILE_FILE="$fw/mcu/_support/AM13E/cmake/test_profiles/e62_sim_only_motor_output.cmake"
          cmake --build .build/esc-control --target AM13E-rev17.3.elf -j 2
          cmake -S "$fw" -B .build/esc-candidate -G "Unix Makefiles" \
            -DESCAPE32_BUILD_AM13E=ON -DAM13E_SDK_ROOT=/tmp/am13e-ti-sdk \
            -DAM13E_BOARD_BOARD_PROFILE_FILE="$fw/mcu/_support/AM13E/cmake/test_profiles/e62_sim_only_early_bemf.cmake"
          cmake --build .build/esc-candidate --target AM13E-rev17.3.elf -j 2
          cp .build/esc-control/AM13E-rev17.3.elf artifacts/e62-exp-source-control.elf
          cp .build/esc-candidate/AM13E-rev17.3.elf artifacts/e62-exp-source-candidate.elf
          sha256sum artifacts/e62-exp-source-control.elf artifacts/e62-exp-source-candidate.elf > artifacts/e62-exp-source-elf-pair.sha256
          test "$(sha256sum artifacts/e62-exp-source-control.elf | cut -c1-64)" != \
               "$(sha256sum artifacts/e62-exp-source-candidate.elf | cut -c1-64)"
          echo 'PASS_DIFFERENT_SOURCE_GUESTS_SAME_MOTOR_OUTPUT_1'
      - name: Provision identical SIM_ONLY ECX87 KV147 Motor Plant
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/sim_motor_cfg.py --sim-only-opt-in \
            --motor-profile ecx87-kv147 \
            --elf baseline/e62-g13b3/firmware/AM13E-rev17.3.elf \
            --output artifacts/e62-g13b3-source-built-matrix-cfg.bin
      - name: Default-policy source-built Control, real 1kHz PA26 frames
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/experimental_e62_bemf_ab.py run \
            --qemu .build/qemu-src/build/qemu-system-arm \
            --elf artifacts/e62-exp-source-control.elf \
            --cfg-flash artifacts/e62-g13b3-source-built-matrix-cfg.bin \
            --profile ${{ matrix.profile }} --label control \
            --artifact artifacts/e62-exp-control.json --wall-timeout-s 250
      - name: Source-built 3000us and 1/4 early-BEMF Candidate, unchanged QEMU
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/experimental_e62_bemf_ab.py run \
            --qemu .build/qemu-src/build/qemu-system-arm \
            --elf artifacts/e62-exp-source-candidate.elf \
            --cfg-flash artifacts/e62-g13b3-source-built-matrix-cfg.bin \
            --profile ${{ matrix.profile }} --label candidate \
            --artifact artifacts/e62-exp-candidate.json --wall-timeout-s 250
      - name: Fail closed on full positive-stage reversal or absent Guest ACKs
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/experimental_e62_bemf_ab.py compare \
            --control artifacts/e62-exp-control.json \
            --candidate artifacts/e62-exp-candidate.json \
            --output artifacts/e62-exp-source-profile-verdict.json
          echo 'PASS_EXPERIMENTAL_SOURCE_BUILT_ONLY_NOT_PINNED_ORIGINAL_P1'
      - name: Preserve exact source-built ELF pair, events and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e62-source-built-matrix-${{ matrix.profile }}-NOT-P1
          path: artifacts/e62-exp-*
          if-no-files-found: warn
          retention-days: 14
