name: E62 EXPERIMENT Original-vs-3ms-quarter Multi-Scenario Rotor Matrix (NOT Original P1)

on:
  push:
    branches: [experiment/e62-early-bemf-quartergate]
    paths:
      - 'machine/am13e23019.c'
      - 'machine/am13e_autonomous_sitl.inc'
      - 'tools/experimental_e62_bemf_ab.py'
      - 'tools/experimental_e62_pinned_ival_patch.py'
      - '.github/workflows/e62-experiment-pinned-five-profile-matrix.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-vs-guarded-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        profile: [smoke, gentle, steps, ramp100, ramp500]
    steps:
      - uses: actions/checkout@v4
      - name: Pin exact Original guest and experimental host syntax
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python3 -m py_compile \
            tools/experimental_e62_pinned_ival_patch.py \
            tools/experimental_e62_bemf_ab.py
          echo '05563b6931b58aaba1df5105313c36c9de2d5797a0a3b190c86777c5773f13c0  baseline/e62-g13b3/firmware/AM13E-rev17.3.elf' | sha256sum -c -
          git submodule update --init --depth 1 qemu
      - name: Rebuild identical corrected physics and preboot external-FC machine
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            libglib2.0-dev libpixman-1-dev libfdt-dev pkg-config meson ninja-build
          ./build.sh
      - name: Exact 3-instruction candidate with unchanged Motor Output and OC safety
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/experimental_e62_pinned_ival_patch.py \
            --elf baseline/e62-g13b3/firmware/AM13E-rev17.3.elf \
            --output-elf artifacts/e62-exp-3-instruction-candidate-NOT-ORIGINAL.elf \
            --proof-json artifacts/e62-exp-3-instruction-proof.json
          python3 tools/sim_motor_cfg.py --sim-only-opt-in \
            --motor-profile ecx87-kv147 \
            --elf baseline/e62-g13b3/firmware/AM13E-rev17.3.elf \
            --output artifacts/e62-exp-matrix-cfg.bin
      - name: Control exact Original ELF and independent external FC
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/experimental_e62_bemf_ab.py run \
            --qemu .build/qemu-src/build/qemu-system-arm \
            --elf baseline/e62-g13b3/firmware/AM13E-rev17.3.elf \
            --cfg-flash artifacts/e62-exp-matrix-cfg.bin \
            --profile ${{ matrix.profile }} --label control \
            --artifact artifacts/e62-exp-control.json --wall-timeout-s 250
      - name: Candidate 3ms initial and 1/4 accelerating CAP1 filter, unchanged physics
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/experimental_e62_bemf_ab.py run \
            --qemu .build/qemu-src/build/qemu-system-arm \
            --elf artifacts/e62-exp-3-instruction-candidate-NOT-ORIGINAL.elf \
            --cfg-flash artifacts/e62-exp-matrix-cfg.bin \
            --profile ${{ matrix.profile }} --label candidate \
            --artifact artifacts/e62-exp-candidate.json --wall-timeout-s 250
      - name: Fail closed on any significant reversal, lost physical source or missing Guest ACK
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/experimental_e62_bemf_ab.py compare \
            --control artifacts/e62-exp-control.json \
            --candidate artifacts/e62-exp-candidate.json \
            --output artifacts/e62-exp-profile-verdict.json
          echo "PASS_EXPERIMENTAL_FC_PROFILE=${{ matrix.profile }}_NOT_P1_OR_HARDWARE"
      - name: Preserve both complete traces and FAIL evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e62-experiment-matrix-${{ matrix.profile }}-not-original-P1
          path: artifacts/e62-exp-*
          retention-days: 14
          if-no-files-found: warn
