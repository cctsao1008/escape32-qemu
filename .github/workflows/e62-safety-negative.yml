name: E62 Independent Safety Negative Gates
on:
  push:
    branches: [main]
    paths:
      - 'machine/**'
      - 'tests/g13b2_native_fault.py'
      - 'tests/g13b2_trip_safety.py'
      - '.github/workflows/e62-safety-negative.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  simulated-physical-fault-routing:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Compile pinned QEMU for actual device route tests
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends libglib2.0-dev libpixman-1-dev libfdt-dev meson ninja-build pkg-config binutils-arm-none-eabi
          git submodule update --init --depth 1 qemu
          ./build.sh
          echo '05563b6931b58aaba1df5105313c36c9de2d5797a0a3b190c86777c5773f13c0  baseline/e62-g13b3/firmware/AM13E-rev17.3.elf' | sha256sum -c -
      - name: Independent QEMU OC/nFAULT hardware route and Trip latch
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python3 tests/g13b2_trip_safety.py \
            --qemu .build/qemu-src/build/qemu-system-arm \
            --elf baseline/e62-g13b3/firmware/AM13E-rev17.3.elf \
            2>&1 | tee artifacts/e62-safety-qemu-routing.log
      - name: Original Guest native fault ISR — independent cases
        shell: bash
        run: |
          set -euo pipefail
          for fault in nfault oc-u oc-v oc-w; do
            echo "E62_SAFETY_TEST_CASE=$fault"
            python3 tests/g13b2_native_fault.py \
              --qemu .build/qemu-src/build/qemu-system-arm \
              --elf baseline/e62-g13b3/firmware/AM13E-rev17.3.elf \
              --fault "$fault" \
              --artifact "artifacts/e62-safety-${fault}.json" \
              2>&1 | tee "artifacts/e62-safety-${fault}.log"
          done
      - name: Preserve native safety evidence on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e62-negative-physical-safety
          path: artifacts/e62-safety-*
          if-no-files-found: warn
          retention-days: 21
