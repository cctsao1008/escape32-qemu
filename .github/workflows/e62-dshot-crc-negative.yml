name: E62 Original Guest Physical DShot CRC Rejection
on:
  push:
    branches: [main]
    paths:
      - 'tests/g13b_native_dshot.py'
      - 'tests/test_dshot_crc_negative.py'
      - 'tests/test_dshot_crc_qualification.py'
      - 'tools/ci/dshot_crc_qualification.py'
      - 'machine/**'
      - '.github/workflows/e62-dshot-crc-negative.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-guest-crc-positive-and-negative:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Check exact physical frame corruption contract
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_dshot_crc_negative.py' -v
          python3 -m unittest discover -s tests -p 'test_dshot_crc_qualification.py' -v
      - name: Build original-Guest QEMU and verify pinned original ELF
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends libglib2.0-dev libpixman-1-dev libfdt-dev pkg-config meson ninja-build binutils-arm-none-eabi
          git submodule update --init --depth 1 qemu
          ./build.sh
          echo '05563b6931b58aaba1df5105313c36c9de2d5797a0a3b190c86777c5773f13c0  baseline/e62-g13b3/firmware/AM13E-rev17.3.elf' | sha256sum -c -
          mkdir -p artifacts
      - name: Valid physical PA26 DShot CRC must be accepted by original Guest
        run: |
          set -euo pipefail
          python3 tests/g13b_native_dshot.py \
            --qemu .build/qemu-src/build/qemu-system-arm \
            --elf baseline/e62-g13b3/firmware/AM13E-rev17.3.elf \
            --throttle 1000 --artifact artifacts/e62-dshot-valid-native.json \
            2>&1 | tee artifacts/e62-dshot-valid-native.log
      - name: Corrupt one wire CRC bit; original Guest must reject without throttle change
        run: |
          set -euo pipefail
          python3 tests/g13b_native_dshot.py \
            --qemu .build/qemu-src/build/qemu-system-arm \
            --elf baseline/e62-g13b3/firmware/AM13E-rev17.3.elf \
            --throttle 1000 --corrupt-crc \
            --artifact artifacts/e62-dshot-bad-crc-native.json \
            2>&1 | tee artifacts/e62-dshot-bad-crc-native.log
          grep -F 'PASS_E62_ORIGINAL_ELF_BAD_DSHOT_CRC_REJECTED' \
            artifacts/e62-dshot-bad-crc-native.log
          python3 tools/ci/dshot_crc_qualification.py \
            --valid artifacts/e62-dshot-valid-native.json \
            --invalid artifacts/e62-dshot-bad-crc-native.json \
            --output artifacts/e62-dshot-crc-native-verdict.json
          echo PASS_E62_NATIVE_BAD_WIRE_CRC_NEGATIVE
      - name: Preserve Guest wire/CRC evidence including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e62-original-guest-dshot-crc-positive-negative
          path: artifacts/e62-dshot-*
          if-no-files-found: warn
          retention-days: 21
