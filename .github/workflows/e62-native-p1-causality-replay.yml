name: E62 P1 Source-Artifact Causality Replay (pinned red matrix)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/e62-native-p1-causality-replay.yml'
      - 'tools/native_p1_causality_ledger.py'
      - 'tests/test_native_p1_causality_ledger.py'
      - 'tools/native_p1_pre_feedback_geometry.py'
      - 'tests/test_native_p1_pre_feedback_geometry.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  read-only-causality-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Download unchanged P1 Original Guest source traces from run 40552428592
        uses: actions/download-artifact@v4
        with:
          name: e62-native-p1-scenario-suite
          run-id: 40552428592
          github-token: ${{ github.token }}
          path: artifacts
      - name: Verify archived original source evidence is present
        shell: bash
        run: |
          set -euo pipefail
          for case in smoke gentle direct20 steps; do
            test -s "artifacts/e62-p1-scripted/e62-p1-script-${case}.p0.events.log"
            test -s "artifacts/e62-p1-scripted/e62-p1-script-${case}.p1.json"
          done
      - name: Unit test and replay all four P1 cases (read-only diagnostic)
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD${PYTHONPATH:+:$PYTHONPATH}"
          python3 tests/test_native_p1_causality_ledger.py
          python3 tests/test_native_p1_pre_feedback_geometry.py
          python3 tools/native_p1_causality_ledger.py \
            --input-root artifacts/e62-p1-scripted \
            --output artifacts/e62-p1-causality-replay.json
          # This run ID predates the ECX87 phase normalization.
          # Explicit archived-only interpretation; NEVER reused for new QEMU.
          python3 tools/native_p1_pre_feedback_geometry.py \
            --historical-terminal-kt-as-phase \
            --input-root artifacts/e62-p1-scripted \
            --output artifacts/e62-p1-early-geometry.json
          echo "E62_P1_CAUSAL_REPLAY_SUCCESS_DIAGNOSTIC_ONLY"
      - name: Publish source-derived findings even on diagnostic mismatch
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e62-p1-causal-ledger-replay-40552428592
          path: |
            artifacts/e62-p1-causality-replay.json
            artifacts/e62-p1-early-geometry.json
          if-no-files-found: warn
          retention-days: 21
