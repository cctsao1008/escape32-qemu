name: E62 EXPERIMENT Original Running OC Sense OST3 No-WFI (NOT Hardware Current)

on:
  push:
    branches: [experiment/e62-early-bemf-quartergate]
    paths:
      - 'machine/am13e23019.c'
      - 'machine/am13e_autonomous_sitl.inc'
      - 'machine/am13e_native_analog_frontend.inc'
      - 'tests/e62_autonomous_native_motor_probe.py'
      - 'tools/native_p1_oc_fault_plan.py'
      - 'tools/native_p1_running_oc_audit.py'
      - 'tests/test_e62_native_running_oc_sense.py'
      - 'scenarios/e62-native-p1-running-oc-*.json'
      - '.github/workflows/e62-experiment-original-running-oc-sense-ost3.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-running-external-oc-sensor:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        phase: [u, v, w]
    steps:
      - uses: actions/checkout@v4
      - name: Unmodified Original ELF SHA + 10 independent negative oracle tests
        shell: bash
        run: |
          set -euo pipefail
          echo '05563b6931b58aaba1df5105313c36c9de2d5797a0a3b190c86777c5773f13c0  baseline/e62-g13b3/firmware/AM13E-rev17.3.elf' | sha256sum -c -
          python3 -m unittest discover -s tests -p test_e62_native_running_oc_sense.py -v
          python3 -m py_compile tools/native_p1_oc_fault_plan.py tools/native_p1_running_oc_audit.py tests/e62_autonomous_native_motor_probe.py
      - name: Build native QEMU physical motor, separate source OC sensor fault hardware
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            libglib2.0-dev libpixman-1-dev libfdt-dev pkg-config meson ninja-build binutils-arm-none-eabi
          git submodule update --init --depth 1 qemu
          ./build.sh
          mkdir -p artifacts/e62-running-oc
          python3 tools/sim_motor_cfg.py --sim-only-opt-in \
            --elf baseline/e62-g13b3/firmware/AM13E-rev17.3.elf \
            --motor-profile ecx87-kv147 \
            --output artifacts/e62-running-oc/sim-cfg-flash.bin
      - name: Genuine no-WFI guest 1kHz DShot while external ADC-like OC source faults
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/e62_autonomous_native_motor_probe.py \
            --qemu .build/qemu-src/build/qemu-system-arm \
            --elf baseline/e62-g13b3/firmware/AM13E-rev17.3.elf \
            --cfg-flash artifacts/e62-running-oc/sim-cfg-flash.bin \
            --scenario scenarios/e62-native-p0-smoke.json \
            --oc-fault-scenario scenarios/e62-native-p1-running-oc-${{ matrix.phase }}.json \
            --wall-timeout-s 300 \
            --artifact artifacts/e62-running-oc/oc-${{ matrix.phase }}.json \
            2>&1 | tee artifacts/e62-running-oc/oc-${{ matrix.phase }}-probe.log
      - name: Strict independent Original Guest OST3 / six-off / persistent latch / no-rearm safety
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/native_p1_running_oc_audit.py \
            --scenario scenarios/e62-native-p0-smoke.json \
            --oc-fault-scenario scenarios/e62-native-p1-running-oc-${{ matrix.phase }}.json \
            --evidence artifacts/e62-running-oc/oc-${{ matrix.phase }}.json \
            --events artifacts/e62-running-oc/oc-${{ matrix.phase }}.p0.events.log \
            --qemu-log artifacts/e62-running-oc/oc-${{ matrix.phase }}.qemu.log \
            --output artifacts/e62-running-oc/oc-${{ matrix.phase }}-strict-verdict.json \
            2>&1 | tee artifacts/e62-running-oc/oc-${{ matrix.phase }}-strict.log
      - name: Retain true original guest and native sensor source evidence even when fault safety fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e62-original-running-oc-${{ matrix.phase }}-sensor-source-not-physical-overcurrent
          path: artifacts/e62-running-oc/**
          if-no-files-found: warn
          retention-days: 21
