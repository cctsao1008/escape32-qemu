name: E62 EXPERIMENT Direct20 BEMF Startup A/B (NOT Original P1)

on:
  push:
    branches: [experiment/e62-early-bemf-direct20]
    paths:
      - 'machine/am13e23019.c'
      - 'machine/am13e_autonomous_sitl.inc'
      - 'tools/experimental_e62_bemf_ab.py'
      - 'tests/fixtures/e62_sim_only_motor_board_profile.cmake'
      - '.github/workflows/e62-experiment-early-bemf-direct20.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  direct20-original-policy-versus-early-cap1:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Verify pinned inputs and compile passive experiment reader
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/experimental_e62_bemf_ab.py
          mkdir -p artifacts
          echo '05563b6931b58aaba1df5105313c36c9de2d5797a0a3b190c86777c5773f13c0  baseline/e62-g13b3/firmware/AM13E-rev17.3.elf' | sha256sum -c -
      - name: Install complete ARM GCC/Newlib toolchain (same as passed ESCape32 CI)
        uses: carlosperate/arm-none-eabi-gcc-action@v1
      - name: Install source build dependencies for independent arm FW and QEMU
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            libglib2.0-dev libpixman-1-dev libfdt-dev pkg-config \
            meson ninja-build
          git submodule update --init --depth 1 qemu
          ./build.sh
      - name: Fetch exact experimental ESCape32 source and pinned TI SDK
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/cctsao1008/ESCape32.git .build/experimental-escape32
          git -C .build/experimental-escape32 checkout --quiet --detach f49b05377d8a7d2e07999ff2eb71ec7b1f7709f5
          test "$(git -C .build/experimental-escape32 rev-parse HEAD)" = "f49b05377d8a7d2e07999ff2eb71ec7b1f7709f5"
          git clone --quiet --depth 1 https://github.com/TexasInstruments/am13e2x_sdk.git /tmp/am13e-ti-sdk
          git -C /tmp/am13e-ti-sdk fetch --quiet --depth 1 origin b872469ceef18de5e39a1d3acb0821ec158b44c7
          git -C /tmp/am13e-ti-sdk checkout --quiet --detach b872469ceef18de5e39a1d3acb0821ec158b44c7
          echo "EXPERIMENT_SOURCE_SHA=f49b05377d8a7d2e07999ff2eb71ec7b1f7709f5"
      - name: Compile matched default and explicit early CAP1 firmware variants
        shell: bash
        run: |
          set -euo pipefail
          fw="$PWD/.build/experimental-escape32"
          board="$PWD/tests/fixtures/e62_sim_only_motor_board_profile.cmake"
          test -s "$board"
          # The unconfigured Reference firmware leaves all motor pads OFF.
          # ONLY this separate SIM_ONLY experiment supplies a complete
          # electrical compile fixture. BOTH control and candidate use it.
          # This is NOT an approved HW board profile, NEVER FLASH.
          cmake -S "$fw" -B .build/exp-fw-default -G "Unix Makefiles" \
            -DESCAPE32_BUILD_AM13E=ON -DAM13E_SDK_ROOT=/tmp/am13e-ti-sdk \
            -DAM13E_BOARD_BOARD_PROFILE_FILE="$board"
          cmake --build .build/exp-fw-default --target AM13E-rev17.3.elf -j 2
          cmake -S "$fw" -B .build/exp-fw-early -G "Unix Makefiles" \
            -DESCAPE32_BUILD_AM13E=ON -DAM13E_SDK_ROOT=/tmp/am13e-ti-sdk \
            -DAM13E_BOARD_BOARD_PROFILE_FILE="$board" \
            -DCMAKE_C_FLAGS="-DAM13E_SIM_ONLY_EXPERIMENTAL_EARLY_BEMF=1"
          cmake --build .build/exp-fw-early --target AM13E-rev17.3.elf -j 2
          cp .build/exp-fw-default/AM13E-rev17.3.elf artifacts/e62-exp-control.elf
          cp .build/exp-fw-early/AM13E-rev17.3.elf artifacts/e62-exp-candidate.elf
          sha256sum artifacts/e62-exp-control.elf artifacts/e62-exp-candidate.elf \
            > artifacts/e62-exp-elf-pair.sha256
          cp "$board" artifacts/e62-exp-SIM-ONLY-NOT-A-PHYSICAL-BOARD.cmake
          test "$(sha256sum artifacts/e62-exp-control.elf | cut -c1-64)" != \
               "$(sha256sum artifacts/e62-exp-candidate.elf | cut -c1-64)"
          echo "PASS_TWO_DISTINCT_NONORIGINAL_GUEST_BUILDS"
      - name: Provision identical SIM_ONLY ECX87 motor config
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/sim_motor_cfg.py --sim-only-opt-in \
            --motor-profile ecx87-kv147 \
            --elf baseline/e62-g13b3/firmware/AM13E-rev17.3.elf \
            --output artifacts/e62-g13b3-exp-direct20-cfg.bin
      - name: Original policy, separately compiled Guest (experiment control)
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/experimental_e62_bemf_ab.py run \
            --qemu .build/qemu-src/build/qemu-system-arm \
            --elf artifacts/e62-exp-control.elf \
            --cfg-flash artifacts/e62-g13b3-exp-direct20-cfg.bin \
            --label control \
            --artifact artifacts/e62-exp-control.json \
            --wall-timeout-s 250
      - name: 4ms initial BEMF interval, separately compiled Guest (experimental candidate)
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/experimental_e62_bemf_ab.py run \
            --qemu .build/qemu-src/build/qemu-system-arm \
            --elf artifacts/e62-exp-candidate.elf \
            --cfg-flash artifacts/e62-g13b3-exp-direct20-cfg.bin \
            --label candidate \
            --artifact artifacts/e62-exp-candidate.json \
            --wall-timeout-s 250
      - name: Fail closed if early CAP1 experiment did not improve startup
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/experimental_e62_bemf_ab.py compare \
            --control artifacts/e62-exp-control.json \
            --candidate artifacts/e62-exp-candidate.json \
            --output artifacts/e62-exp-direct20-comparison.json
          echo "PASS_DIAGNOSTIC_ONLY_NOT_ORIGINAL_GUEST_P1"
      - name: Preserve all evidence INCLUDING FAIL and both experimental ELFs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e62-early-cap1-direct20-exp-not-original-guest
          path: artifacts/e62-exp-*
          retention-days: 14
          if-no-files-found: warn
