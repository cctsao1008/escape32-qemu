name: E62 Bounded Six-Pad Focus Observer Differential (Original Guest)
on:
  push:
    branches: [main]
    paths:
      - 'machine/am13e23019.c'
      - 'machine/am13e_native_motor_plant.inc'
      - 'machine/am13e_native_pwm_coupling.inc'
      - 'tests/e62_autonomous_native_motor_probe.py'
      - 'tools/native_source_energy_audit.py'
      - 'tools/native_source_focus_differential.py'
      - 'tests/test_native_source_focus_differential.py'
      - 'tools/native_preboot_fc_source.py'
      - 'tests/test_native_preboot_fc_source.py'
      - 'machine/am13e_autonomous_sitl.inc'
      - 'tools/native_p0_strict.py'
      - '.github/workflows/e62-neutral-source-focus-differential.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-focus-is-observation-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Run fail-closed comparator unit tests
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/test_native_source_focus_differential.py
          python3 tests/test_native_preboot_fc_source.py
      - name: Source build pinned native QEMU AM13E machine
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            libglib2.0-dev libpixman-1-dev libfdt-dev pkg-config \
            meson ninja-build binutils-arm-none-eabi
          git submodule update --init --depth 1 qemu
          echo '05563b6931b58aaba1df5105313c36c9de2d5797a0a3b190c86777c5773f13c0  baseline/e62-g13b3/firmware/AM13E-rev17.3.elf' | sha256sum -c -
          ./build.sh
      - name: Prepare unchanged SIM_ONLY config
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python3 tools/sim_motor_cfg.py --sim-only-opt-in \
            --elf baseline/e62-g13b3/firmware/AM13E-rev17.3.elf \
            --motor-profile ecx87-kv147 \
            --output artifacts/e62-g13b3-focus-cfg.bin
      # Diagnostic-only preboot machine FC clock schedule.
      # NO QTest/QMP/-S/host-paced input. QEMU icount RR records only
      # nondeterministic scheduling; never Guest memory or physics state.
      # No claim about P0/P1: only the two source artifacts qualify this
      # replay's reproducibility before the observer ON comparison.
      - name: Diagnostic preboot original Guest / FC OFF-A
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/native_preboot_fc_source.py \
            --qemu .build/qemu-src/build/qemu-system-arm \
            --elf baseline/e62-g13b3/firmware/AM13E-rev17.3.elf \
            --cfg-flash artifacts/e62-g13b3-focus-cfg.bin \
            --scenario scenarios/e62-native-p0-smoke.json \
            --artifact artifacts/e62-focus-off.json \
            --rr-mode record \
            --rr-file artifacts/e62-focus-icount.rr.bin \
            --wall-timeout-s 210 \
            > artifacts/e62-focus-off-runner.log
      - name: Diagnostic preboot original Guest / FC OFF-B (A/A)
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/native_preboot_fc_source.py \
            --qemu .build/qemu-src/build/qemu-system-arm \
            --elf baseline/e62-g13b3/firmware/AM13E-rev17.3.elf \
            --cfg-flash artifacts/e62-g13b3-focus-cfg.bin \
            --scenario scenarios/e62-native-p0-smoke.json \
            --artifact artifacts/e62-focus-off-repeat.json \
            --rr-mode replay \
            --rr-file artifacts/e62-focus-icount.rr.bin \
            --wall-timeout-s 210 \
            > artifacts/e62-focus-off-repeat-runner.log
      - name: Strict original source energy on OFF-A and OFF-B
        shell: bash
        run: |
          set -euo pipefail
          for mode in off off-repeat; do
            python3 tools/native_source_energy_audit.py \
              --events artifacts/e62-focus-$mode.p0.events.log \
              --output artifacts/e62-focus-$mode.energy.json \
              > artifacts/e62-focus-$mode.energy.log
          done
      - name: Fail closed unless independent OFF/OFF source and energy are identical
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/native_source_focus_differential.py \
            --phase baseline \
            --output artifacts/e62-focus-repeatability.json
      - name: Diagnostic preboot original Guest / FC observer 2795–2840ms ON
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/native_preboot_fc_source.py \
            --qemu .build/qemu-src/build/qemu-system-arm \
            --elf baseline/e62-g13b3/firmware/AM13E-rev17.3.elf \
            --cfg-flash artifacts/e62-g13b3-focus-cfg.bin \
            --scenario scenarios/e62-native-p0-smoke.json \
            --artifact artifacts/e62-focus-on.json \
            --rr-mode replay \
            --rr-file artifacts/e62-focus-icount.rr.bin \
            --switch-focus-window-ms 2795:2840 \
            --wall-timeout-s 210 \
            > artifacts/e62-focus-on-runner.log
      - name: Strict original ON source energy audit
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/native_source_energy_audit.py \
            --events artifacts/e62-focus-on.p0.events.log \
            --output artifacts/e62-focus-on.energy.json \
            > artifacts/e62-focus-on.energy.log
      - name: Fail closed on any changed original source/energy in OFF/ON
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/native_source_focus_differential.py \
            --phase differential \
            --output artifacts/e62-focus-differential.json
      - name: Preserve complete off/on source logs and energy audit on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e62-neutral-source-focus-differential
          path: artifacts/e62-focus-*
          if-no-files-found: warn
          retention-days: 21
