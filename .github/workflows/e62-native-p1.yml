name: E62 P1 Native Throttle / Frontend / Performance (strict SIM_ONLY)
on:
  push:
    branches: [main]
    paths:
      - 'machine/**'
      - 'tests/e62_autonomous_native_motor_probe.py'
      - 'tools/native_p1_qualification.py'
      - 'tools/e62_native_scripted_test.py'
      - 'tools/native_p1_startup_transient.py'
      - 'tools/native_p1_causality_ledger.py'
      - 'tools/native_p1_pre_feedback_geometry.py'
      - 'tests/test_native_p1_pre_feedback_geometry.py'
      - 'tests/test_native_p1_causality_ledger.py'
      - 'tests/test_native_p1_startup_transient.py'
      - 'tests/test_e62_native_scripted_test.py'
      - 'scenarios/e62-native-p1-ramp20-*.json'
      - 'tools/native_dshot_scenario.py'
      - 'tools/native_p0_strict.py'
      - 'scenarios/e62-native-p0-*.json'
      - 'tests/test_native_p1_qualification.py'
      - '.github/workflows/e62-native-p1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-p1-scenario-suite:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned QEMU source build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            libglib2.0-dev libpixman-1-dev libfdt-dev pkg-config \
            meson ninja-build binutils-arm-none-eabi
      - name: Validate source contracts, pinned original Guest and native QEMU
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD${PYTHONPATH:+:$PYTHONPATH}"
          python3 tests/test_native_p1_qualification.py
          python3 tests/test_native_p1_causality_ledger.py
          python3 tests/test_native_p1_pre_feedback_geometry.py
          python3 tests/test_native_p1_startup_transient.py
          python3 tests/test_e62_native_scripted_test.py
          python3 tests/test_e62_native_dshot_scenario.py
          git submodule update --init --depth 1 qemu
          echo '05563b6931b58aaba1df5105313c36c9de2d5797a0a3b190c86777c5773f13c0  baseline/e62-g13b3/firmware/AM13E-rev17.3.elf' | sha256sum -c -
          ./build.sh
      - name: Provision unchanged original Guest SIM_ONLY ECX87 config
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python3 tools/sim_motor_cfg.py --sim-only-opt-in \
            --elf baseline/e62-g13b3/firmware/AM13E-rev17.3.elf \
            --motor-profile ecx87-kv147 \
            --output artifacts/e62-g13b3-native-autonomous-cfg-flash.bin
      - name: Script-first isolated three-case original Guest source and rotor matrix
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/e62_native_scripted_test.py \
            --case smoke --case gentle --case direct20 --case steps \
            --qemu .build/qemu-src/build/qemu-system-arm \
            --elf baseline/e62-g13b3/firmware/AM13E-rev17.3.elf \
            --cfg-flash artifacts/e62-g13b3-native-autonomous-cfg-flash.bin \
            --output artifacts/e62-p1-scripted \
            --wall-timeout-s 300
      - name: Experimental FC slew-rate A/B (100ms vs 500ms, not a waived P1 acceptance)
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          python3 tools/e62_native_scripted_test.py \
            --case ramp20_100ms --case ramp20_500ms \
            --qemu .build/qemu-src/build/qemu-system-arm \
            --elf baseline/e62-g13b3/firmware/AM13E-rev17.3.elf \
            --cfg-flash artifacts/e62-g13b3-native-autonomous-cfg-flash.bin \
            --output artifacts/e62-p1-ramp-ab \
            --wall-timeout-s 300
          result=$?
          echo "P1_RAMP_AB_EXPERIMENT_EXIT=${result} (never overrides main P1 FAIL)"
          exit "$result"
      - name: Read-only original source 50ms startup torque/current/IRQ A/B diagnosis
        if: always()
        run: |
          set -euo pipefail
          python3 tools/native_p1_startup_transient.py \
            --case smoke=artifacts/e62-p1-scripted/e62-p1-script-smoke.p0.events.log \
            --case gentle=artifacts/e62-p1-scripted/e62-p1-script-gentle.p0.events.log \
            --case direct20=artifacts/e62-p1-scripted/e62-p1-script-direct20.p0.events.log \
            --case steps=artifacts/e62-p1-scripted/e62-p1-script-steps.p0.events.log \
            --output artifacts/e62-p1-scripted/e62-p1-startup-transients.json
      - name: Read-only full-run Original Guest sector / AQ-DB / rotor / CAP1 / TIMG12 causality ledger
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/native_p1_causality_ledger.py \
            --input-root artifacts/e62-p1-scripted \
            --output artifacts/e62-p1-scripted/e62-p1-causality.json
      - name: Original Guest pre-TIMG12 physical six-pad and torque sign audit
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/native_p1_pre_feedback_geometry.py \
            --input-root artifacts/e62-p1-scripted \
            --output artifacts/e62-p1-scripted/e62-p1-early-geometry.json
      - name: Preserve scenarios, source events and negative results without discarding FAIL
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e62-native-p1-scenario-suite
          path: |
            artifacts/e62-p1-scripted/**
            artifacts/e62-p1-ramp-ab/**
          retention-days: 21
          if-no-files-found: warn
