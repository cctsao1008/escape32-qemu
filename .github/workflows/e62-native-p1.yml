name: E62 P1 Native Throttle / Frontend / Performance (strict SIM_ONLY)
on:
  push:
    branches: [main]
    paths:
      - 'machine/**'
      - 'tests/e62_autonomous_native_motor_probe.py'
      - 'tools/native_p1_qualification.py'
      - 'tools/e62_native_scripted_test.py'
      - 'tests/test_e62_native_scripted_test.py'
      - 'tools/native_dshot_scenario.py'
      - 'tools/native_p0_strict.py'
      - 'scenarios/e62-native-p0-*.json'
      - 'tests/test_native_p1_qualification.py'
      - '.github/workflows/e62-native-p1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-p1-scenario-suite:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned QEMU source build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            libglib2.0-dev libpixman-1-dev libfdt-dev pkg-config \
            meson ninja-build binutils-arm-none-eabi
      - name: Validate source contracts, pinned original Guest and native QEMU
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/test_native_p1_qualification.py
          python3 tests/test_e62_native_dshot_scenario.py
          git submodule update --init --depth 1 qemu
          echo '05563b6931b58aaba1df5105313c36c9de2d5797a0a3b190c86777c5773f13c0  baseline/e62-g13b3/firmware/AM13E-rev17.3.elf' | sha256sum -c -
          ./build.sh
      - name: Provision unchanged original Guest SIM_ONLY ECX87 config
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python3 tools/sim_motor_cfg.py --sim-only-opt-in \
            --elf baseline/e62-g13b3/firmware/AM13E-rev17.3.elf \
            --motor-profile ecx87-kv147 \
            --output artifacts/e62-g13b3-native-autonomous-cfg-flash.bin
      - name: Script-first isolated three-case original Guest source and rotor matrix
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/e62_native_scripted_test.py \
            --case smoke --case gentle --case direct20 --case steps \
            --qemu .build/qemu-src/build/qemu-system-arm \
            --elf baseline/e62-g13b3/firmware/AM13E-rev17.3.elf \
            --cfg-flash artifacts/e62-g13b3-native-autonomous-cfg-flash.bin \
            --output artifacts/e62-p1-scripted \
            --wall-timeout-s 300
      - name: Preserve scenarios, source events and negative results without discarding FAIL
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e62-native-p1-scenario-suite
          path: |
            artifacts/e62-p1-scripted/**
          retention-days: 21
          if-no-files-found: warn
