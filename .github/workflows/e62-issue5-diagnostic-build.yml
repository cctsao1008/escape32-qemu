name: E62 Issue 5 Diagnostic Firmware Build and Native Probe
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tests/g13b2_native_drive_probe.py'
      - 'tools/e62_issue5_bemf_diag.py'
      - '.github/workflows/e62-issue5-diagnostic-build.yml'
permissions:
  contents: read
jobs:
  native-bemf-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: carlosperate/arm-none-eabi-gcc-action@v1
      - name: Pin AM13E Firmware and TI SDK
        shell: bash
        run: |
          set -euo pipefail
          git clone -q --depth 1 -b am13e-port-v2 https://github.com/cctsao1008/ESCape32.git diagnostic-escape32
          test "$(git -C diagnostic-escape32 rev-parse HEAD)" = "53953c04f7d857f3b402b3a19870605ed0471d8f"
          git clone -q https://github.com/TexasInstruments/am13e2x_sdk.git /tmp/am13e-sdk
          git -C /tmp/am13e-sdk checkout -q --detach b872469ceef18de5e39a1d3acb0821ec158b44c7
      - name: Build diagnostic Firmware without altering original candidate
        shell: bash
        run: |
          set -euo pipefail
          cmake -S diagnostic-escape32 -B diagnostic-build \
            -DESCAPE32_BUILD_AM13E=ON -DAM13E_SDK_ROOT=/tmp/am13e-sdk \
            -DAM13E_BOOT_LINKER_SCRIPT="$PWD/diagnostic-escape32/boot/mcu/AM13E/config.ld" \
            -DAM13E_BOARD_BOARD_PROFILE_FILE="$PWD/tests/fixtures/g13b3l_sim_only_ramp.cmake"
          cmake --build diagnostic-build --target AM13E-rev17.3.elf -j 3
          mkdir -p artifacts
          cp diagnostic-build/AM13E-rev17.3.elf artifacts/e62-issue5-diagnostic.elf
          arm-none-eabi-nm diagnostic-build/AM13E-rev17.3.elf | tee artifacts/e62-issue5-diagnostic-symbols.txt
          for symbol in am13e_bemf_diag_seq am13e_bemf_diag_ring am13e_bemf_diag_first; do
            grep -Eq "[[:space:]][BD] $symbol$" artifacts/e62-issue5-diagnostic-symbols.txt
          done
          arm-none-eabi-size diagnostic-build/AM13E-rev17.3.elf | tee artifacts/e62-issue5-diagnostic-size.txt
          sha256sum diagnostic-build/AM13E-rev17.3.elf | tee artifacts/e62-issue5-diagnostic-sha256.txt
      - name: Build native QEMU and check original baseline unchanged
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends libglib2.0-dev libpixman-1-dev libfdt-dev pkg-config meson ninja-build binutils-arm-none-eabi
          git submodule update --init --depth 1 qemu
          ./build.sh
          echo '05563b6931b58aaba1df5105313c36c9de2d5797a0a3b190c86777c5773f13c0  baseline/e62-g13b3/firmware/AM13E-rev17.3.elf' | sha256sum -c -
      - name: Read diagnostic decisions from real Guest (24V baseline, NOT 47V qualification)
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/g13b2_native_drive_probe.py \
            --qemu .build/qemu-src/build/qemu-system-arm \
            --elf diagnostic-build/AM13E-rev17.3.elf \
            --throttle 1500 --startup-steps 32768 \
            --slice-ms 300 --runtime-slices 20 \
            --wait-native-bemf-calibration --calibration-wfi-visits 24 \
            --require-drive --require-native-pwm --require-native-bemf-arm \
            --issue5-bemf-diag \
            --artifact artifacts/e62-issue5-diagnostic-native.json \
            2>&1 | tee artifacts/e62-issue5-diagnostic-native.log
      - name: Preserve evidence even after failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e62-issue5-diagnostic-build-native
          path: artifacts/e62-issue5-*
          if-no-files-found: warn
          retention-days: 21
