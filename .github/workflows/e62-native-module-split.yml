name: E62 Native Virtual-Time Module Split (semantic identity)
on:
  push:
    branches: [main]
    paths:
      - 'machine/am13e_native_motor_plant.inc'
      - 'machine/am13e_native_motor_dynamics.inc'
      - 'machine/am13e_native_analog_frontend.inc'
      - 'machine/am13e_native_pwm_coupling.inc'
      - 'machine/am13e_pwm_history.inc'
      - 'machine/am13e_motor_feedback.inc'
      - 'tests/test_native_virtual_time_module_split.py'
      - 'docs/current/e62-native-virtual-time-modules.md'
      - '.github/workflows/e62-native-module-split.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-single-clock-source-identity:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify original physical callback and current/torque/analog source identity
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/test_native_virtual_time_module_split.py
          echo "E62_NATIVE_SOURCE_SPLIT_IDENTICAL; P0/P1 acceptance still independent"
