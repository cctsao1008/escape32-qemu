            --qemu .build/qemu-src/build/qemu-system-arm \
            --elf /tmp/e62-fw-sim-only/AM13E-rev17.3.elf \
            --startup-steps 32768 --slice-ms 150 \
            --runtime-slices 12 \
            --artifact artifacts/g13b2c-native-safety.json \
            2>&1 | tee artifacts/g13b2c-native-safety.log

      - name: G13B2D original ELF physical nFAULT and 3-phase OC IRQ shutdown
        run: |
          set -euo pipefail
          mkdir -p artifacts
          for kind in nfault oc-w oc-v oc-u; do
            python3 tests/g13b2_native_fault.py \
              --qemu .build/qemu-src/build/qemu-system-arm \
              --elf /tmp/e62-fw-sim-only/AM13E-rev17.3.elf \
              --fault "$kind" --startup-steps 32768 \
              --slice-ms 150 --runtime-slices 12 \
              --artifact "artifacts/g13b2d-${kind}.json" \
              2>&1 | tee "artifacts/g13b2d-${kind}.log"
          done
          echo PASS_G13B2D_NATIVE_SAFETY_IRQ_FOUR_PHYSICAL_FAULT_CASES
      - name: G13B2E original uncalibrated BEMF fail-closed (nFAULT healthy)
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python3 tests/g13b2_native_drive_probe.py \
            --qemu .build/qemu-src/build/qemu-system-arm \
            --elf /tmp/e62-fw-sim-only/AM13E-rev17.3.elf \
            --throttle 1000 --startup-steps 32768 \
            --slice-ms 300 --runtime-slices 20 \
            --require-bemf-reject \
            --artifact artifacts/g13b2e-original-positive-drive.json \
            2>&1 | tee artifacts/g13b2e-original-positive-drive.log
          # Deliberately no --require-drive: until real native Gate/
          # PWM proof exists, this step is a diagnostic, NOT closed-loop PASS.
      - name: G13B2E ideal virtual BEMF reference native positive diagnostic
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python3 tests/g13b2_native_drive_probe.py \
            --qemu .build/qemu-src/build/qemu-system-arm \
            --elf /tmp/e62-fw-sim-ideal-bemf/AM13E-rev17.3.elf \
            --throttle 1000 --startup-steps 32768 \
            --slice-ms 300 --runtime-slices 20 \
            --artifact artifacts/g13b2e-ideal-bemf-native-drive.json \
            2>&1 | tee artifacts/g13b2e-ideal-bemf-native-drive.log
          # Native original HAL writes CMPSS0 DAC. The nominal 2048
          # neutral is a virtual board hypothesis, NOT production safety.
          # This is still diagnostic-only: G13B2E positive Gate only PASS
          # if the explicit original-guest readback proves Gate/PWM ON.
      - name: G13B2E + G13B3A/B and G13B3C native capture-arm eligibility
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python3 tests/g13b2_native_drive_probe.py \
            --qemu .build/qemu-src/build/qemu-system-arm \
            --elf /tmp/e62-fw-sim-ideal-bemf/AM13E-rev17.3.elf \
            --throttle 1000 --startup-steps 32768 \
            --slice-ms 300 --runtime-slices 20 \
            --wait-native-bemf-calibration --calibration-wfi-visits 24 \
            --require-drive --require-native-pwm \
            --require-native-plant-seed --require-native-bemf-arm \
            --artifact artifacts/g13b2e-native-calibrated-dshot.json \
            2>&1 | tee artifacts/g13b2e-native-calibrated-dshot.log
          # Only the guest's own SysTick/ECAP calibration_done can permit
          # progress. Never fake the BEMF-ready bit or force motor outputs.
      - name: G13B3D native runtime ECAP clock + continuous six-PWM plant sampling
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python3 tests/g13b2_native_drive_probe.py             --qemu .build/qemu-src/build/qemu-system-arm             --elf /tmp/e62-fw-sim-ideal-bemf/AM13E-rev17.3.elf             --throttle 1000 --startup-steps 32768             --slice-ms 300 --runtime-slices 20             --wait-native-bemf-calibration --calibration-wfi-visits 24             --require-drive --require-native-pwm             --require-native-bemf-arm             --require-native-timeline --timeline-visits 4             --artifact artifacts/g13b3d-native-pwm-timeline.json             2>&1 | tee artifacts/g13b3d-native-pwm-timeline.log
          # Read-only original ELF/GDB WFI snapshots and ECAP1 TSCTR
          # timestamps. No firmware/IRQ/PWM/clock_step/BEMF stimulus.
      - name: G13B3E native plant derived three-phase BEMF injection
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python3 tests/g13b2_native_drive_probe.py \
            --qemu .build/qemu-src/build/qemu-system-arm \
            --elf /tmp/e62-fw-sim-ideal-bemf/AM13E-rev17.3.elf \
            --throttle 1000 --startup-steps 32768 \
            --slice-ms 300 --runtime-slices 20 \
            --wait-native-bemf-calibration --calibration-wfi-visits 24 \
            --require-drive --require-native-pwm \
            --require-native-bemf-arm --require-native-bemf-injection \
            --timeline-visits 4 \
            --artifact artifacts/g13b3e-native-bemf-injection.json \
            2>&1 | tee artifacts/g13b3e-native-bemf-injection.log
          # Only three NON-SILICON QEMU voltage stimuli may be written.
          # No forced comparator edge, CAP1, IRQ, native gate or throttle.
      - name: G13B3F genuine native ECAP capture from plant BEMF
        run: |
