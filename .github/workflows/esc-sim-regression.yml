name: E62 AM13E QEMU firmware integration

on:
  push:
    branches: [main]
    paths:
      - 'machine/**'
      - 'tests/**'
      - 'tools/**'
      - 'build.sh'
      - 'test.sh'
      - '.github/workflows/esc-sim-regression.yml'
  workflow_dispatch:

jobs:
  firmware-backed-qemu:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout pinned QEMU submodule
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 1

      - name: Install QEMU dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libglib2.0-dev \
            libpixman-1-dev libfdt-dev ninja-build meson python3 git \
            gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi
          arm-none-eabi-gcc --version | head -1

      - name: Pin ESCape32 HAL fix and TI SDK
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/cctsao1008/ESCape32.git /tmp/e62-escape32
          git -C /tmp/e62-escape32 checkout --quiet --detach b0204670515d2de0b2480b52273038f1ee13d30a
          git clone --quiet https://github.com/TexasInstruments/am13e2x_sdk.git /tmp/e62-sdk
          git -C /tmp/e62-sdk checkout --quiet --detach b872469ceef18de5e39a1d3acb0821ec158b44c7
          test -f /tmp/e62-sdk/source/driverlib/am13e230x/dl_mcpwm.c
          arm-none-eabi-gcc --version | head -1

      - name: Build real AM13E-rev17.3 ELF from source
        run: |
          set -euo pipefail
          cmake -S /tmp/e62-escape32 -B /tmp/e62-fw-build \
            -G 'Unix Makefiles' \
            -DESCAPE32_BUILD_AM13E=ON \
            -DAM13E_SDK_ROOT=/tmp/e62-sdk \
            -DAM13E_BOOT_LINKER_SCRIPT=/tmp/e62-escape32/boot/mcu/AM13E/config.ld
          # Test the actual Application ELF only; Boot firmware is a separate
          # project and is not needed for QEMU's application handoff.
          cmake --build /tmp/e62-fw-build --target AM13E-rev17.3.elf -j 2
          test -f /tmp/e62-fw-build/AM13E-rev17.3.elf
          arm-none-eabi-objdump -d /tmp/e62-fw-build/AM13E-rev17.3.elf \
            | grep -A 4 '<DL_MCPWM_setEmulationMode>:' | head -5

      - name: G13B2A compile separately guarded SIM_ONLY board
        run: |
          set -euo pipefail
          mkdir -p artifacts
          SIM_PROFILE="$PWD/tests/fixtures/g13b2_sim_only_board.cmake"
          # Negative build configuration: a SIM_ONLY board may NEVER
          # accidentally become the default production/reference target.
          if cmake -S /tmp/e62-escape32 -B /tmp/e62-fw-sim-denied \
              -G 'Unix Makefiles' \
              -DESCAPE32_BUILD_AM13E=ON \
              -DAM13E_SDK_ROOT=/tmp/e62-sdk \
              -DAM13E_BOARD_BOARD_PROFILE_FILE="$SIM_PROFILE" \
              -DAM13E_BOOT_LINKER_SCRIPT=/tmp/e62-escape32/boot/mcu/AM13E/config.ld \
              > artifacts/g13b2a-no-optin.log 2>&1; then
            echo 'ERROR: SIM_ONLY profile compiled without explicit opt-in'
            exit 1
          fi
          grep -F 'G13B2 SIM_ONLY board requires' artifacts/g13b2a-no-optin.log
          echo PASS_G13B2A_OPT_IN_FAIL_CLOSED
          cmake -S /tmp/e62-escape32 -B /tmp/e62-fw-sim-only \
            -G 'Unix Makefiles' \
            -DESCAPE32_BUILD_AM13E=ON \
            -DAM13E_SDK_ROOT=/tmp/e62-sdk \
            -DG13B2_SIM_ONLY_OPT_IN=ON \
            -DAM13E_BOARD_BOARD_PROFILE_FILE="$SIM_PROFILE" \
            -DAM13E_BOOT_LINKER_SCRIPT=/tmp/e62-escape32/boot/mcu/AM13E/config.ld \
            2>&1 | tee artifacts/g13b2a-configure.log
          cmake --build /tmp/e62-fw-sim-only --target AM13E-rev17.3.elf -j 2 \
            2>&1 | tee artifacts/g13b2a-build.log
          test -s /tmp/e62-fw-sim-only/AM13E-rev17.3.elf
          if cmp -s /tmp/e62-fw-build/AM13E-rev17.3.elf \
                    /tmp/e62-fw-sim-only/AM13E-rev17.3.elf; then
            echo 'ERROR: SIM_ONLY binary identical to reference (profile ignored)'
            exit 1
          fi
          arm-none-eabi-readelf -h /tmp/e62-fw-sim-only/AM13E-rev17.3.elf \
            | grep -F 'Machine:'
          sha256sum /tmp/e62-fw-build/AM13E-rev17.3.elf \
                    /tmp/e62-fw-sim-only/AM13E-rev17.3.elf
          echo PASS_G13B2A_NATIVE_SIM_ONLY_PROFILE_BUILD_ONLY
      - name: Build pinned QEMU AM13E model
        run: |
          set -euo pipefail
          ./build.sh

      - name: G13B2A SIM_ONLY original ELF preflight (NO DRIVE gate)
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python3 tests/g13b2_sim_only_preflight.py \
            --qemu .build/qemu-src/build/qemu-system-arm \
            --elf /tmp/e62-fw-sim-only/AM13E-rev17.3.elf \
            --steps 32768 \
            --artifact artifacts/g13b2a-original-sim-only-preflight.json \
            2>&1 | tee artifacts/g13b2a-original-sim-only-preflight.log
          # This is deliberately a NO-UNQUALIFIED-DRIVE safety gate.
          # An unmodeled nFAULT/OC trip is a blocked motor, not success.
      - name: G13B2C native SIM_ONLY neutral protection ready
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python3 tests/g13b2_native_safety.py \
            --qemu .build/qemu-src/build/qemu-system-arm \
            --elf /tmp/e62-fw-sim-only/AM13E-rev17.3.elf \
            --startup-steps 32768 --slice-ms 150 \
            --runtime-slices 12 \
            --artifact artifacts/g13b2c-native-safety.json \
            2>&1 | tee artifacts/g13b2c-native-safety.log

      - name: Run G0-G10 tests against real ELF
        run: |
          set -euo pipefail
          mkdir -p artifacts
          ./test.sh /tmp/e62-fw-build/AM13E-rev17.3.elf \
            2>&1 | tee artifacts/g0-g10.log

      - name: Extended G1 native PWM4 and ECAP1 initialization trace
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python3 tests/g1_handoff.py \
            --qemu .build/qemu-src/build/qemu-system-arm \
            --elf /tmp/e62-fw-build/AM13E-rev17.3.elf \
            --esc-sim --timed-steps --fast-delay-loops \
            --startup-steps 32768 --require-pwm4-init --require-ecap1-init \
            2>&1 | tee artifacts/g1-pwm4-ecap1-init.log

      - name: G11 Cortex-M33 exception lifecycle native ELF diagnostic
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python3 tests/g11_exception_lifecycle.py \
            --qemu .build/qemu-src/build/qemu-system-arm \
            --elf /tmp/e62-fw-build/AM13E-rev17.3.elf \
            --mode both --startup-steps 32768 --post-steps 512 \
            --require-no-invpc --artifact-dir artifacts \
            2>&1 | tee artifacts/g11-exception-lifecycle.log

      - name: G11 independent Cortex-M33 PendSV exception control
        run: |
          set -euo pipefail
          arm-none-eabi-gcc -mcpu=cortex-m33 -mthumb -nostdlib -nostartfiles \
            -Wl,-T,tests/fixtures/g11_pendsv_irq.ld \
            tests/fixtures/g11_pendsv_irq.S \
            -o artifacts/g11_pendsv_irq.elf
          python3 tests/g11_minimal_exception.py \
            --qemu .build/qemu-src/build/qemu-system-arm \
            --elf artifacts/g11_pendsv_irq.elf \
            --artifact-dir artifacts \
            2>&1 | tee artifacts/g11-independent-pendsv.log

      - name: G12 native runtime progress vs virtual instruction time
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python3 tests/g12_runtime_progress.py \
            --qemu .build/qemu-src/build/qemu-system-arm \
            --elf /tmp/e62-fw-build/AM13E-rev17.3.elf \
            --shifts 2 10 --startup-steps 32768 \
            --slice-ms 80 --max-stops 9 \
            --require-wfi-roundtrip \
            --require-no-invpc --require-shift2-progress \
            --artifact-dir artifacts \
            2>&1 | tee artifacts/g12-runtime-progress.log

      - name: G13B0 native reference no-command drive authorization
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python3 tests/g13b_native_no_drive.py \
            --qemu .build/qemu-src/build/qemu-system-arm \
            --elf /tmp/e62-fw-build/AM13E-rev17.3.elf \
            --startup-steps 32768 --slice-ms 100 \
            --artifact artifacts/g13b0-native-drive.json \
            2>&1 | tee artifacts/g13b0-native-drive.log

      - name: G13B1 original-ELF DShot600 PA26 input via TIMER capture DMA
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python3 tests/g13b_native_dshot.py \
            --qemu .build/qemu-src/build/qemu-system-arm \
            --elf /tmp/e62-fw-build/AM13E-rev17.3.elf \
            --throttle 1000 --startup-steps 32768 --slice-ms 300 \
            --artifact artifacts/g13b1-native-dshot.json \
            2>&1 | tee artifacts/g13b1-native-dshot.log

      - name: Upload truthful integration logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e62-qemu-integration
          path: artifacts/
          if-no-files-found: warn
