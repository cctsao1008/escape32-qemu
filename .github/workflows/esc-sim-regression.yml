name: E62 AM13E QEMU firmware integration

on:
  push:
    branches: [main]
    paths:
      - 'machine/**'
      - 'tests/**'
      - 'tools/**'
      - 'build.sh'
      - 'test.sh'
      - '.github/workflows/esc-sim-regression.yml'
  workflow_dispatch:

# Only the newest main commit needs a full native run. Historical passing
# commits stay immutable in Git and their completed Action logs remain linked.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  firmware-backed-qemu:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      # On a cache hit, the committed gitlink is enough to establish
      # pinned source identity; clone QEMU only if a rebuild is required.
      - name: Checkout E62 harness (defer pinned QEMU submodule)
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      # Pin the compiled emulator to its exact QEMU revision AND all
      # in-repo machine code/build flags. A Python audit-only edit can
      # reuse it, while any machine/build change invalidates the cache.
      - name: Restore exact-source pinned QEMU compiled build
        id: qemu-cache
        uses: actions/cache/restore@v4
        with:
          path: .build/qemu-src/build
          key: e62-qemu-ubuntu2404-${{ runner.arch }}-${{ hashFiles('build.sh', 'machine/**') }}-v1

      # The upstream ESCape32, TI SDK and SIM_ONLY CMake profiles are
      # pinned. Cache the four ORIGINAL firmware binaries across Python
      # audit edits. Never cache Guest runtime or synthesize firmware.
      - name: Restore pinned original ELF profile bundle
        id: fw-cache
        uses: actions/cache/restore@v4
        with:
          path: .build/e62-fw-artifacts
          key: e62-fw-ubuntu2404-GCC13-ESCb0204670-SDKb872469c-${{ hashFiles('tests/fixtures/g13b2_sim_only_board.cmake', 'tests/fixtures/g13b3l_sim_only_ramp.cmake') }}-v1

      - name: Verify source-keyed cached firmware before native use
        if: steps.fw-cache.outputs.cache-hit == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd .build/e62-fw-artifacts
          sha256sum -c SHA256SUMS
          for variant in reference sim-only ideal-bemf fast-ramp; do
            test -s "$variant.elf"
          done
          mkdir -p /tmp/e62-fw-build /tmp/e62-fw-sim-only \
                   /tmp/e62-fw-sim-ideal-bemf /tmp/e62-fw-fast-ramp
          cp reference.elf /tmp/e62-fw-build/AM13E-rev17.3.elf
          cp sim-only.elf /tmp/e62-fw-sim-only/AM13E-rev17.3.elf
          cp ideal-bemf.elf /tmp/e62-fw-sim-ideal-bemf/AM13E-rev17.3.elf
          cp fast-ramp.elf /tmp/e62-fw-fast-ramp/AM13E-rev17.3.elf
          echo "E62_PINNED_ORIGINAL_ELF_CACHE_HIT_VERIFIED"

      - name: Restore signed-package ARM binutils host tools
        id: binutils-cache
        uses: actions/cache/restore@v4
        with:
          path: .build/e62-host-binutils
          key: e62-host-binutils-noble-x64-GNU242-v1

      - name: Restore verified QEMU runtime libfdt
        id: fdt-cache
        uses: actions/cache/restore@v4
        with:
          path: .build/e62-host-runtime
          key: e62-qemu-libfdt1-noble-x64-v1

      # Fast FAIL-CLOSED path: all four exact-source pinned caches
      # must hit together. No compiler/SDK download is required to observe
      # the ORIGINAL ELF's independent CAP1 -> TIMG12 -> MCPWM trajectory.
      # If this fails, stop before installing the full build environment.
      # If it passes, the standard full firmware/protection suite follows.
      - name: Fast native L+M acceptance from verified pinned caches
        id: fast-native
        if: steps.qemu-cache.outputs.cache-hit == 'true' && steps.fw-cache.outputs.cache-hit == 'true' && steps.binutils-cache.outputs.cache-hit == 'true' && steps.fdt-cache.outputs.cache-hit == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-tree HEAD qemu | awk '{print $3}')" = \
            "44f28df24767cf9dca1ddc9b23157737c4cbb645"
          test -x .build/qemu-src/build/qemu-system-arm
          (cd .build/e62-fw-artifacts && sha256sum -c SHA256SUMS)
          (cd .build/e62-host-binutils && sha256sum -c SHA256SUMS)
          (cd .build/e62-host-runtime && sha256sum -c SHA256SUMS)
          export PATH="$PWD/.build/e62-host-binutils:$PATH"
          export LD_LIBRARY_PATH="$PWD/.build/e62-host-runtime:${LD_LIBRARY_PATH:-}"
          # Do not launch a cached QEMU if any dynamic link is unresolved.
          if ldd .build/qemu-src/build/qemu-system-arm | grep -q 'not found'; then
            echo "E62_QEMU_MISSING_CACHED_RUNTIME_LIBRARY"
            exit 1
          fi
          .build/qemu-src/build/qemu-system-arm --version | head -1
          .build/qemu-src/build/qemu-system-arm -M help | grep -q am13e23019
          arm-none-eabi-objdump --version | head -1
          mkdir -p artifacts
          python3 tools/native_sim_cfg_flash.py \
            --sim-only-opt-in \
            --elf /tmp/e62-fw-fast-ramp/AM13E-rev17.3.elf \
            --output artifacts/g13b3n-original-cfg-flash.bin
          echo "E62_FAST_PINNED_ELF_QEMU_BINUTILS_VERIFIED_NO_BUILD"
          set -euo pipefail
          mkdir -p artifacts
          # G13B3 edge-plan preflight is model-derived QTest provenance
          # only. The following original strict native gates are UNCHANGED.
          python3 tests/g13b3_pwm_switch_plan.py \
            --qemu .build/qemu-src/build/qemu-system-arm \
            --elf /tmp/e62-fw-fast-ramp/AM13E-rev17.3.elf \
            2>&1 | tee artifacts/g13b3-qemu-switch-plan.log
          echo "PASS_G13B3_QEMU_MODEL_DERIVED_CARRIER_PLAN_PREFLIGHT"
          # G13B3 timeline is a *clocked* QEMU-internal observer with
          # explicit ring overflow. This QTest peripheral fixture is NOT
          # native Guest motor or physical MOSFET waveform qualification.
          python3 tests/g13b3_pwm_history.py \
            --qemu .build/qemu-src/build/qemu-system-arm \
            --elf /tmp/e62-fw-fast-ramp/AM13E-rev17.3.elf \
            2>&1 | tee artifacts/g13b3-qemu-clocked-history.log
          echo "PASS_G13B3_QEMU_CLOCKED_INTERNAL_HISTORY_PREFLIGHT"

          echo "G13B3_NATIVE_INDEPENDENT_PARALLEL_GATES_START"
          (
            set -euo pipefail
            mkdir -p artifacts
            python3 tests/g13b2_native_drive_probe.py \
              --qemu .build/qemu-src/build/qemu-system-arm \
              --elf /tmp/e62-fw-fast-ramp/AM13E-rev17.3.elf \
              --throttle 1500 --startup-steps 32768 \
              --slice-ms 300 --runtime-slices 20 \
              --wait-native-bemf-calibration --calibration-wfi-visits 24 \
              --require-drive --require-native-pwm \
              --require-native-bemf-arm --require-native-sustained-loop \
              --sim-only-cfg-flash artifacts/g13b3n-original-cfg-flash.bin \
              --sustained-wfi-visits 1500 --sustained-sectors 6 \
              --initial-electrical-degrees -30 \
              --artifact artifacts/g13b3l-native-six-powered-sector-loop.json \
              2>&1 | tee artifacts/g13b3l-native-six-powered-sector-loop.log
            # STRICT: fail this firmware-backed CI unless six accepted
            # physical CAP1->native TIMG12->powered six-step transitions
            # AND an independently qualified multi-WFI power path pass.
            # No one-event or non-driven virtual RPM can satisfy the gate.
          ) &
          pid_l=$!
          (
            set -euo pipefail
            mkdir -p artifacts
            # Preserve the previously passing six-sector G13B3L unchanged.
            # Use the SAME original Rel17 ELF, factory Cfg and strict protection.
            python3 tests/g13b2_native_drive_probe.py \
              --qemu .build/qemu-src/build/qemu-system-arm \
              --elf /tmp/e62-fw-fast-ramp/AM13E-rev17.3.elf \
              --throttle 1500 --startup-steps 32768 \
              --slice-ms 300 --runtime-slices 20 \
              --wait-native-bemf-calibration --calibration-wfi-visits 24 \
              --require-drive --require-native-pwm \
              --require-native-bemf-arm --require-native-sustained-loop \
              --sim-only-cfg-flash artifacts/g13b3n-original-cfg-flash.bin \
              --sustained-wfi-visits 2800 --sustained-sectors 12 \
              --sustained-min-integrated-ns 90000000 \
              --initial-electrical-degrees -30 \
              --artifact artifacts/g13b3m-extended-twelve-sector.json \
              --sitl-trace-output artifacts/g13b3m-native-sitl-trace.json \
                --sitl-native-pwm-history \
              --sitl-live-port 0 \
              2>&1 | tee artifacts/g13b3m-extended-twelve-sector.log
          python3 tools/native_pwm_history_report.py \
            --trace artifacts/g13b3m-native-sitl-trace.json \
            --require-observed-original-guest-edge \
            --output artifacts/g13b3m-native-pwm-history-evidence.json \
            2>&1 | tee artifacts/g13b3m-native-pwm-history-evidence.log
          # QEMU-internal original Guest WFI history is independent of
          # unmodified strict 12-sector/90ms rotor-direction acceptance.
            python3 tools/native_extended_run_gate.py \
              --artifact artifacts/g13b3m-extended-twelve-sector.json \
              --min-sectors 12 --min-integrated-ns 90000000 \
              --min-powered-pwm-samples 600 \
              --output artifacts/g13b3m-extended-strict-verdict.json \
              2>&1 | tee artifacts/g13b3m-extended-strict-verdict.log
            # Separate positive gate: two unbroken source-derived cycles,
            # original CAP1/TIMG12, native PWM and ECAP-time evidence.
            # All evidence stays SIM_ONLY; no actual E62 current/thermal PASS.
          ) &
          pid_m=$!
          l_status=0
          m_status=0
          wait "$pid_l" || l_status=$?
          wait "$pid_m" || m_status=$?
          echo "G13B3L_INDEPENDENT_GATE_EXIT=$l_status"
          echo "G13B3M_INDEPENDENT_GATE_EXIT=$m_status"
          if (( l_status != 0 || m_status != 0 )); then
            echo "G13B3_NATIVE_PARALLEL_STRICT_GATE_FAIL"
            exit 1
          fi
          echo "PASS_G13B3L_G13B3M_BOTH_INDEPENDENT_NATIVE_GATES"


      # The official ubuntu-24.04 runner is ephemeral. In a measured run,
      # downloading 57.5MB gcc-arm-none-eabi + 49.2MB newlib via Azure APT
      # mirror retried for 27min. Cache the ORIGINAL official .deb archives,
      # not a copied installation, and let dpkg/apt resolve dependencies.
      - name: Restore official ARM GCC and newlib .deb downloads
        id: arm-debs-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/e62-arm-debs
          key: e62-noble-${{ runner.arch }}-gcc13-newlib4-debs-v1

      - name: Install QEMU and ARM firmware build dependencies (bounded)
        shell: bash
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          # A measured warm-cache retry downloaded the 57.5MB GCC again
          # despite apt-get being given an explicit local .deb pathname.
          # The GitHub Azure APT mirror also took minutes for tiny libs.
          # Prefer Ubuntu's official archive mirror (still signed APT
          # repository metadata), without changing Ubuntu release/suite.
          if [[ -f /etc/apt/apt-mirrors.txt ]] &&
              grep -q 'azure.archive.ubuntu.com' /etc/apt/apt-mirrors.txt; then
            sudo sed -i \
              's#http://azure.archive.ubuntu.com/ubuntu#http://archive.ubuntu.com/ubuntu#g' \
              /etc/apt/apt-mirrors.txt
          fi
          # Rate-limited Ubuntu mirrors must not hold the entire job for
          # half an hour. Bounded network retries fail visibly, not falsely.
          sudo timeout 180s apt-get \
            -o Acquire::Retries=1 \
            -o Acquire::http::Timeout=25 \
            -o Acquire::https::Timeout=25 update
          DEB_DIR="$RUNNER_TEMP/e62-arm-debs"
          mkdir -p "$DEB_DIR"
          shopt -s nullglob
          arm_debs=()
          for pkg in gcc-arm-none-eabi libnewlib-arm-none-eabi; do
            matches=( "$DEB_DIR"/"$pkg"_*.deb )
            if (( ${#matches[@]} == 0 )); then
              echo "ARM_DEB_CACHE_MISS $pkg; downloading official Ubuntu archive"
              (
                cd "$DEB_DIR"
                timeout 240s apt-get \
                  -o Acquire::Retries=1 \
                  -o Acquire::http::Timeout=25 \
                  -o Acquire::https::Timeout=25 download "$pkg"
              )
              matches=( "$DEB_DIR"/"$pkg"_*.deb )
            else
              echo "ARM_DEB_CACHE_HIT $pkg"
            fi
            if (( ${#matches[@]} != 1 )); then
              echo "ERROR: expected exactly one official $pkg .deb"
              exit 1
            fi
            dpkg-deb --info "${matches[0]}" >/dev/null
            if [[ "$(dpkg-deb -f "${matches[0]}" Package)" != "$pkg" ]]; then
              echo "ERROR: wrong cached Debian package for $pkg"
              exit 1
            fi
            arm_debs+=( "${matches[0]}" )
          done
          # Step 1: only small prerequisite packages through signed APT.
          # CRITICAL: do NOT put local ARM .debs in this APT transaction.
          # On ubuntu-24.04 APT may choose a repository candidate over a
          # same-version local .deb; the measured retry downloaded all
          # 116MB again despite a 102MB cache HIT.
          sudo timeout 300s apt-get \
            -o Acquire::Retries=1 \
            -o Acquire::http::Timeout=25 \
            -o Acquire::https::Timeout=25 \
            install -y --no-install-recommends \
            build-essential pkg-config libglib2.0-dev \
            libpixman-1-dev libfdt-dev ninja-build meson python3 git \
            binutils-arm-none-eabi libnewlib-dev
          # Step 2: guarantee the two large compiler archives come only
          # from the validated local cache. dpkg does not contact a mirror.
          sudo dpkg -i "${arm_debs[@]}"
          for pkg in gcc-arm-none-eabi libnewlib-arm-none-eabi; do
            test "$(dpkg-query -W -f='${Status}' "$pkg")" = 'install ok installed'
          done
          arm-none-eabi-gcc --version | head -1
          test -f /usr/share/doc/libnewlib-arm-none-eabi/copyright

      # Save IMMEDIATELY after successful install, even if a later strict
      # original-firmware or rotor-direction gate legitimately FAILS.
      # A combined actions/cache action saves only after job success.
      - name: Save verified official ARM toolchain archives
        if: steps.arm-debs-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/e62-arm-debs
          key: e62-noble-${{ runner.arch }}-gcc13-newlib4-debs-v1

      # The full-path official /usr/bin tools are copied into a hash-
      # validated bundle after APT has installed the signed Ubuntu package.
      # Never cache a compiler binary or a Guest firmware state mutation.
      - name: Cache original Ubuntu ARM binutils CLI for fast gate
        if: steps.binutils-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          base=.build/e62-host-binutils
          mkdir -p "$base"
          for name in objdump nm readelf addr2line; do
            file="arm-none-eabi-$name"
            cp "/usr/bin/$file" "$base/$file"
            test -x "$base/$file"
          done
          (cd "$base" && sha256sum arm-none-eabi-* > SHA256SUMS && sha256sum -c SHA256SUMS)
          echo "E62_SIGNED_UBUNTU_BINUTILS_CACHE_BUNDLE_VALIDATED"

      - name: Persist host binutils before native gate
        if: steps.binutils-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .build/e62-host-binutils
          key: e62-host-binutils-noble-x64-GNU242-v1

      - name: Cache verified Ubuntu libfdt runtime for no-APT QEMU
        if: steps.fdt-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          base=.build/e62-host-runtime
          mkdir -p "$base"
          # The official signed libfdt1 Debian package was installed by APT.
          test "$(dpkg-query -W -f='${Status}' libfdt1)" = 'install ok installed'
          src="$(ldconfig -p | awk '/libfdt.so.1 / { print $NF; exit }')"
          test -n "$src"
          test -f "$src"
          cp -L "$src" "$base/libfdt.so.1"
          (cd "$base" && sha256sum libfdt.so.1 > SHA256SUMS && sha256sum -c SHA256SUMS)
          echo "E62_SIGNED_UBUNTU_LIBFDT_RUNTIME_CACHE_VALIDATED"

      - name: Persist official libfdt runtime before native gate
        if: steps.fdt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .build/e62-host-runtime
          key: e62-qemu-libfdt1-noble-x64-v1

      - name: Pin ESCape32 HAL fix and TI SDK
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/cctsao1008/ESCape32.git /tmp/e62-escape32
          git -C /tmp/e62-escape32 checkout --quiet --detach b0204670515d2de0b2480b52273038f1ee13d30a
          git clone --quiet https://github.com/TexasInstruments/am13e2x_sdk.git /tmp/e62-sdk
          git -C /tmp/e62-sdk checkout --quiet --detach b872469ceef18de5e39a1d3acb0821ec158b44c7
          test -f /tmp/e62-sdk/source/driverlib/am13e230x/dl_mcpwm.c
          arm-none-eabi-gcc --version | head -1

      - name: Build real AM13E-rev17.3 ELF from source
        run: |
          set -euo pipefail
          if [[ "${{ steps.fw-cache.outputs.cache-hit }}" != "true" ]]; then
            cmake -S /tmp/e62-escape32 -B /tmp/e62-fw-build \
              -G 'Unix Makefiles' \
              -DESCAPE32_BUILD_AM13E=ON \
              -DAM13E_SDK_ROOT=/tmp/e62-sdk \
              -DAM13E_BOOT_LINKER_SCRIPT=/tmp/e62-escape32/boot/mcu/AM13E/config.ld
            # Test the actual Application ELF only; Boot firmware is a separate
            # project and is not needed for QEMU's application handoff.
            cmake --build /tmp/e62-fw-build --target AM13E-rev17.3.elf -j 2
          else
            echo "E62_PINNED_REFERENCE_ELF_ALREADY_CACHED"
          fi
          test -f /tmp/e62-fw-build/AM13E-rev17.3.elf
          arm-none-eabi-objdump -d /tmp/e62-fw-build/AM13E-rev17.3.elf \
            | grep -A 4 '<DL_MCPWM_setEmulationMode>:' | head -5

      - name: G13B2A compile separately guarded SIM_ONLY board
        run: |
          set -euo pipefail
          mkdir -p artifacts
          SIM_PROFILE="$PWD/tests/fixtures/g13b2_sim_only_board.cmake"
          # Negative build configuration: a SIM_ONLY board may NEVER
          # accidentally become the default production/reference target.
          if cmake -S /tmp/e62-escape32 -B /tmp/e62-fw-sim-denied \
              -G 'Unix Makefiles' \
              -DESCAPE32_BUILD_AM13E=ON \
              -DAM13E_SDK_ROOT=/tmp/e62-sdk \
              -DAM13E_BOARD_BOARD_PROFILE_FILE="$SIM_PROFILE" \
              -DAM13E_BOOT_LINKER_SCRIPT=/tmp/e62-escape32/boot/mcu/AM13E/config.ld \
              > artifacts/g13b2a-no-optin.log 2>&1; then
            echo 'ERROR: SIM_ONLY profile compiled without explicit opt-in'
            exit 1
          fi
          grep -F 'G13B2 SIM_ONLY board requires' artifacts/g13b2a-no-optin.log
          echo PASS_G13B2A_OPT_IN_FAIL_CLOSED
          if [[ "${{ steps.fw-cache.outputs.cache-hit }}" != "true" ]]; then
            cmake -S /tmp/e62-escape32 -B /tmp/e62-fw-sim-only \
              -G 'Unix Makefiles' \
              -DESCAPE32_BUILD_AM13E=ON \
              -DAM13E_SDK_ROOT=/tmp/e62-sdk \
              -DG13B2_SIM_ONLY_OPT_IN=ON \
              -DAM13E_BOARD_BOARD_PROFILE_FILE="$SIM_PROFILE" \
              -DAM13E_BOOT_LINKER_SCRIPT=/tmp/e62-escape32/boot/mcu/AM13E/config.ld \
              2>&1 | tee artifacts/g13b2a-configure.log
            cmake --build /tmp/e62-fw-sim-only --target AM13E-rev17.3.elf -j 2 \
              2>&1 | tee artifacts/g13b2a-build.log
          else
            echo "E62_PINNED_SIM_ONLY_ELF_ALREADY_CACHED"
          fi
          test -s /tmp/e62-fw-sim-only/AM13E-rev17.3.elf
          if cmp -s /tmp/e62-fw-build/AM13E-rev17.3.elf \
                    /tmp/e62-fw-sim-only/AM13E-rev17.3.elf; then
            echo 'ERROR: SIM_ONLY binary identical to reference (profile ignored)'
            exit 1
          fi
          arm-none-eabi-readelf -h /tmp/e62-fw-sim-only/AM13E-rev17.3.elf \
            | grep -F 'Machine:'
          sha256sum /tmp/e62-fw-build/AM13E-rev17.3.elf \
                    /tmp/e62-fw-sim-only/AM13E-rev17.3.elf
          echo PASS_G13B2A_NATIVE_SIM_ONLY_PROFILE_BUILD_ONLY
      - name: G13B2E separate original ELF ideal virtual BEMF reference (TEST ONLY)
        run: |
          set -euo pipefail
          mkdir -p artifacts
          if [[ "${{ steps.fw-cache.outputs.cache-hit }}" != "true" ]]; then
            cmake -S /tmp/e62-escape32 -B /tmp/e62-fw-sim-ideal-bemf \
              -G 'Unix Makefiles' \
              -DESCAPE32_BUILD_AM13E=ON \
              -DAM13E_SDK_ROOT=/tmp/e62-sdk \
              -DG13B2_SIM_ONLY_OPT_IN=ON \
              -DG13B2_SIM_ONLY_IDEAL_BEMF_REFERENCE=ON \
              -DAM13E_BOARD_BOARD_PROFILE_FILE="$PWD/tests/fixtures/g13b2_sim_only_board.cmake" \
              -DAM13E_BOOT_LINKER_SCRIPT=/tmp/e62-escape32/boot/mcu/AM13E/config.ld \
              2>&1 | tee artifacts/g13b2e-ideal-bemf-cmake.log
            cmake --build /tmp/e62-fw-sim-ideal-bemf \
              --target AM13E-rev17.3.elf -j 2 \
              2>&1 | tee artifacts/g13b2e-ideal-bemf-build.log
          else
            echo "E62_PINNED_IDEAL_BEMF_ELF_ALREADY_CACHED"
          fi
          test -s /tmp/e62-fw-sim-ideal-bemf/AM13E-rev17.3.elf
          if cmp -s /tmp/e62-fw-sim-only/AM13E-rev17.3.elf \
                    /tmp/e62-fw-sim-ideal-bemf/AM13E-rev17.3.elf; then
            echo 'ERROR: ideal BEMF reference opt-in had no effect'
            exit 1
          fi
          echo PASS_G13B2E_IDEAL_BEMF_REFERENCE_SEPARATE_NATIVE_ELF_ONLY
      - name: Build or verify exact-source pinned QEMU AM13E model
        shell: bash
        run: |
          set -euo pipefail
          # A cache hit is only accepted for the hashed build.sh+machine
          # sources and the original pinned submodule. No acceptance
          # test is skipped; only a byte-for-byte matching rebuild.
          # git ls-tree checks the *committed* QEMU submodule gitlink,
          # even when its working directory is deliberately not checked out.
          test "$(git ls-tree HEAD qemu | awk '{print $3}')" = \
            "44f28df24767cf9dca1ddc9b23157737c4cbb645"
          if [[ "${{ steps.qemu-cache.outputs.cache-hit }}" == "true" ]]; then
            echo "E62_QEMU_EXACT_SOURCE_CACHE_HIT"
            test -x .build/qemu-src/build/qemu-system-arm
            .build/qemu-src/build/qemu-system-arm --version | head -1
            .build/qemu-src/build/qemu-system-arm -M help \
              | grep -q 'am13e23019'
          else
            echo "E62_QEMU_EXACT_SOURCE_CACHE_MISS; cloning pinned QEMU and rebuilding"
            git submodule update --init --depth 1 qemu
            test "$(git -C qemu rev-parse HEAD)" = \
              "44f28df24767cf9dca1ddc9b23157737c4cbb645"
            ./build.sh
          fi

      - name: Save exact-source pinned QEMU compiled build
        if: steps.qemu-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .build/qemu-src/build
          key: e62-qemu-ubuntu2404-${{ runner.arch }}-${{ hashFiles('build.sh', 'machine/**') }}-v1

      # Fail-fast native acceptance order: prepare the same original
      # firmware/Cfg and verify G13B3L (6) then G13B3M (12 / 90ms).
      # When a strict endurance gate legitimately FAILS, avoid minutes
      # of irrelevant independent tests. On PASS, ALL unchanged safety,
      # protection, timing, QEMU and G0-G13 tests still run below.
      # This reorder does not relax a single gate or suppress evidence.
      - name: G13B3N original-ELF Cfg Flash factory provisioning SIM_ONLY
        run: |
          set -euo pipefail
          # Original main.c:792 unconditionally copies 0x4000 Flash Cfg
          # into Guest SRAM. Keep original linker .cfg NOLOAD untouched.
          if [[ "${{ steps.fw-cache.outputs.cache-hit }}" != "true" ]]; then
            cmake -S /tmp/e62-escape32 -B /tmp/e62-fw-fast-ramp \
              -G 'Unix Makefiles' -DESCAPE32_BUILD_AM13E=ON \
              -DAM13E_SDK_ROOT=/tmp/e62-sdk \
              -DG13B2_SIM_ONLY_OPT_IN=ON \
              -DG13B2_SIM_ONLY_IDEAL_BEMF_REFERENCE=ON \
              -DAM13E_BOARD_BOARD_PROFILE_FILE="$PWD/tests/fixtures/g13b3l_sim_only_ramp.cmake" \
              -DAM13E_BOOT_LINKER_SCRIPT=/tmp/e62-escape32/boot/mcu/AM13E/config.ld \
              2>&1 | tee artifacts/g13b3l-fast-ramp-configure.log
            cmake --build /tmp/e62-fw-fast-ramp \
              --target AM13E-rev17.3.elf -j 2 \
              2>&1 | tee artifacts/g13b3l-fast-ramp-build.log
          else
            echo "E62_PINNED_FAST_RAMP_ELF_ALREADY_CACHED"
          fi
          test -s /tmp/e62-fw-fast-ramp/AM13E-rev17.3.elf
          arm-none-eabi-readelf -SW /tmp/e62-fw-fast-ramp/AM13E-rev17.3.elf \
            | tee artifacts/g13b3l-fast-ramp-elf-sections.txt
          grep -E '\.cfg[[:space:]]+NOBITS' \
            artifacts/g13b3l-fast-ramp-elf-sections.txt
          # Derive genuine Rel17 Cfg bytes from source cfgdata in ELF
          # and factory-program only QEMU pre-reset FLASH_CFG1.
          python3 tools/native_sim_cfg_flash.py \
            --sim-only-opt-in \
            --elf /tmp/e62-fw-fast-ramp/AM13E-rev17.3.elf \
            --output artifacts/g13b3n-original-cfg-flash.bin \
            2>&1 | tee artifacts/g13b3n-original-cfg-flash.log
          if cmp -s /tmp/e62-fw-fast-ramp/AM13E-rev17.3.elf \
            /tmp/e62-fw-sim-ideal-bemf/AM13E-rev17.3.elf; then
            echo 'ERROR: SIM_ONLY DUTY_RATE not represented in original ELF'
            exit 1
          fi
          echo PASS_G13B3N_ORIGINAL_ELF_AND_PREBOOT_FLASH_CFG_PROVISIONING
      - name: Save newly built original source-keyed ELF bundle
        if: steps.fw-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          base=.build/e62-fw-artifacts
          mkdir -p "$base"
          cp /tmp/e62-fw-build/AM13E-rev17.3.elf "$base/reference.elf"
          cp /tmp/e62-fw-sim-only/AM13E-rev17.3.elf "$base/sim-only.elf"
          cp /tmp/e62-fw-sim-ideal-bemf/AM13E-rev17.3.elf "$base/ideal-bemf.elf"
          cp /tmp/e62-fw-fast-ramp/AM13E-rev17.3.elf "$base/fast-ramp.elf"
          (cd "$base" && sha256sum reference.elf sim-only.elf ideal-bemf.elf fast-ramp.elf > SHA256SUMS && sha256sum -c SHA256SUMS)
          # Ensure the four original source-built firmware profiles differ.
          test "$(sha256sum "$base/reference.elf" | awk '{print $1}')" != \
            "$(sha256sum "$base/sim-only.elf" | awk '{print $1}')"
          echo "E62_ORIGINAL_ELF_CACHE_BUNDLE_VALIDATED"

      - name: Persist original ELF bundle before native gate
        if: steps.fw-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .build/e62-fw-artifacts
          key: e62-fw-ubuntu2404-GCC13-ESCb0204670-SDKb872469c-${{ hashFiles('tests/fixtures/g13b2_sim_only_board.cmake', 'tests/fixtures/g13b3l_sim_only_ramp.cmake') }}-v1

      # Each invocation launches its own QEMU+GDB Unix sockets in a
      # tempfile.TemporaryDirectory; they do not share writable Guest state.
      # Execute BOTH unchanged positive gates concurrently, preserving
      # independent six-sector and twelve-sector/90ms CI artifacts.
      - name: G13B3L + G13B3M independent native acceptance (parallel; both strict)
        if: steps.fast-native.outcome != 'success'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          # G13B3 edge-plan preflight is model-derived QTest provenance
          # only. The following original strict native gates are UNCHANGED.
          python3 tests/g13b3_pwm_switch_plan.py \
            --qemu .build/qemu-src/build/qemu-system-arm \
            --elf /tmp/e62-fw-fast-ramp/AM13E-rev17.3.elf \
            2>&1 | tee artifacts/g13b3-qemu-switch-plan.log
          echo "PASS_G13B3_QEMU_MODEL_DERIVED_CARRIER_PLAN_PREFLIGHT"
          # G13B3 timeline is a *clocked* QEMU-internal observer with
          # explicit ring overflow. This QTest peripheral fixture is NOT
          # native Guest motor or physical MOSFET waveform qualification.
          python3 tests/g13b3_pwm_history.py \
            --qemu .build/qemu-src/build/qemu-system-arm \
            --elf /tmp/e62-fw-fast-ramp/AM13E-rev17.3.elf \
            2>&1 | tee artifacts/g13b3-qemu-clocked-history.log
          echo "PASS_G13B3_QEMU_CLOCKED_INTERNAL_HISTORY_PREFLIGHT"

          echo "G13B3_NATIVE_INDEPENDENT_PARALLEL_GATES_START"
          (
            set -euo pipefail
            mkdir -p artifacts
            python3 tests/g13b2_native_drive_probe.py \
              --qemu .build/qemu-src/build/qemu-system-arm \
              --elf /tmp/e62-fw-fast-ramp/AM13E-rev17.3.elf \
              --throttle 1500 --startup-steps 32768 \
              --slice-ms 300 --runtime-slices 20 \
              --wait-native-bemf-calibration --calibration-wfi-visits 24 \
              --require-drive --require-native-pwm \
              --require-native-bemf-arm --require-native-sustained-loop \
              --sim-only-cfg-flash artifacts/g13b3n-original-cfg-flash.bin \
              --sustained-wfi-visits 1500 --sustained-sectors 6 \
              --initial-electrical-degrees -30 \
              --artifact artifacts/g13b3l-native-six-powered-sector-loop.json \
              2>&1 | tee artifacts/g13b3l-native-six-powered-sector-loop.log
            # STRICT: fail this firmware-backed CI unless six accepted
            # physical CAP1->native TIMG12->powered six-step transitions
            # AND an independently qualified multi-WFI power path pass.
            # No one-event or non-driven virtual RPM can satisfy the gate.
          ) &
          pid_l=$!
          (
            set -euo pipefail
            mkdir -p artifacts
            # Preserve the previously passing six-sector G13B3L unchanged.
            # Use the SAME original Rel17 ELF, factory Cfg and strict protection.
            python3 tests/g13b2_native_drive_probe.py \
              --qemu .build/qemu-src/build/qemu-system-arm \
              --elf /tmp/e62-fw-fast-ramp/AM13E-rev17.3.elf \
              --throttle 1500 --startup-steps 32768 \
              --slice-ms 300 --runtime-slices 20 \
              --wait-native-bemf-calibration --calibration-wfi-visits 24 \
              --require-drive --require-native-pwm \
              --require-native-bemf-arm --require-native-sustained-loop \
              --sim-only-cfg-flash artifacts/g13b3n-original-cfg-flash.bin \
              --sustained-wfi-visits 2800 --sustained-sectors 12 \
              --sustained-min-integrated-ns 90000000 \
              --initial-electrical-degrees -30 \
              --artifact artifacts/g13b3m-extended-twelve-sector.json \
              --sitl-trace-output artifacts/g13b3m-native-sitl-trace.json \
                --sitl-native-pwm-history \
              --sitl-live-port 0 \
              2>&1 | tee artifacts/g13b3m-extended-twelve-sector.log
          python3 tools/native_pwm_history_report.py \
            --trace artifacts/g13b3m-native-sitl-trace.json \
            --require-observed-original-guest-edge \
            --output artifacts/g13b3m-native-pwm-history-evidence.json \
            2>&1 | tee artifacts/g13b3m-native-pwm-history-evidence.log
          # QEMU-internal original Guest WFI history is independent of
          # unmodified strict 12-sector/90ms rotor-direction acceptance.
            python3 tools/native_extended_run_gate.py \
              --artifact artifacts/g13b3m-extended-twelve-sector.json \
              --min-sectors 12 --min-integrated-ns 90000000 \
              --min-powered-pwm-samples 600 \
              --output artifacts/g13b3m-extended-strict-verdict.json \
              2>&1 | tee artifacts/g13b3m-extended-strict-verdict.log
            # Separate positive gate: two unbroken source-derived cycles,
            # original CAP1/TIMG12, native PWM and ECAP-time evidence.
            # All evidence stays SIM_ONLY; no actual E62 current/thermal PASS.
          ) &
          pid_m=$!
          l_status=0
          m_status=0
          wait "$pid_l" || l_status=$?
          wait "$pid_m" || m_status=$?
          echo "G13B3L_INDEPENDENT_GATE_EXIT=$l_status"
          echo "G13B3M_INDEPENDENT_GATE_EXIT=$m_status"
          if (( l_status != 0 || m_status != 0 )); then
            echo "G13B3_NATIVE_PARALLEL_STRICT_GATE_FAIL"
            exit 1
          fi
          echo "PASS_G13B3L_G13B3M_BOTH_INDEPENDENT_NATIVE_GATES"

      - name: G13B2A SIM_ONLY original ELF preflight (NO DRIVE gate)
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python3 tests/g13b2_sim_only_preflight.py \
            --qemu .build/qemu-src/build/qemu-system-arm \
            --elf /tmp/e62-fw-sim-only/AM13E-rev17.3.elf \
            --steps 32768 \
            --artifact artifacts/g13b2a-original-sim-only-preflight.json \
            2>&1 | tee artifacts/g13b2a-original-sim-only-preflight.log
          # This is deliberately a NO-UNQUALIFIED-DRIVE safety gate.
          # An unmodeled nFAULT/OC trip is a blocked motor, not success.
      - name: G13B2A physically asserted nFAULT must fail closed
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python3 tests/g13b2_sim_only_preflight.py \
            --qemu .build/qemu-src/build/qemu-system-arm \
            --elf /tmp/e62-fw-sim-only/AM13E-rev17.3.elf \
            --steps 32768 --nfault-asserted \
            --artifact artifacts/g13b2a-nfault-asserted.json \
